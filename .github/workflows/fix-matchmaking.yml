name: Fix World Connect matchmaking

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'fix: repair roulette matchmaking deterministically')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch matchmaking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          x = p.read_text()
          x = x.replace("const clientId=localStorage.wvrClientId||(localStorage.wvrClientId=crypto.randomUUID());", "const clientId=sessionStorage.wvrClientId||(sessionStorage.wvrClientId=crypto.randomUUID());")
          x = x.replace("world-connect-roulette-v2", "world-connect-roulette-v4")
          pattern = r"function scanPeers\(\).*?async function startRoulette"
          replacement = '''function scanPeers(){if(!s.channel||s.connected||s.peer)return;const state=s.channel.presenceState(),all=[];Object.values(state).forEach(metas=>metas.forEach(p=>{if(p.clientId&&!p.matchedWith&&p.clientId!==clientId&&p.searching!==false)all.push(p)}));const me={clientId,searching:true,matchedWith:null,country:s.country,language:s.lang};all.push(me);all.sort((a,b)=>String(a.clientId).localeCompare(String(b.clientId)));const i=all.findIndex(p=>p.clientId===clientId);if(i<0||i%2===1)return;const p=all[i+1];if(!p||p.clientId===clientId)return;s.peer=p;s.searching=false;render();s.channel.track({clientId,country:s.country,language:s.lang,searching:false,matchedWith:p.clientId,online:true}).catch(()=>{});connectPeer(p)}async function startRoulette'''
          x,n = re.subn(pattern,replacement,x,count=1,flags=re.S)
          if n != 1:
            raise SystemExit('scanPeers function not found')
          p.write_text(x)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: repair roulette matchmaking deterministically" || exit 0
          git push