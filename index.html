t.key==='Enter')sendChat()"><button class="btn primary" onclick="sendChat()">Send</button></div></div></div>`}async function attachVideos(){if(s.page!=='call')return;const l=document.getElementById('local');const r=document.getElementById('remote');if(l&&s.stream){l.srcObject=s.stream;try{await l.play()}catch(e){}}if(r&&s.remote){r.srcObject=s.remote;try{await r.play()}catch(e){}}}async function getMedia(){if(s.stream)return s.stream;if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera/microphone API unavailable. Use HTTPS.');s.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});return s.stream}async function openChannel(){if(s.channel)return;s.channel=db.channel('world-connect-v1',{config:{presence:{key:clientId}}});s.channel.on('presence',{event:'sync'},()=>scanPeers());s.channel.on('broadcast',{event:'signal'},async msg=>{const p=msg.payload;if(p?.to===clientId)await handleSignal(p)});s.channel.on('broadcast',{event:'chat'},msg=>{const p=msg.payload;if(p?.to===clientId){s.chat.push({text:p.text,me:false});render()}});await new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(Error('Supabase Realtime timeout'))}},10000);s.channel.subscribe(async status=>{if(status==='SUBSCRIBED'&&!done){done=true;clearTimeout(timer);try{await s.channel.track({clientId,country:s.country,language:s.lang,online:true});resolve()}catch(e){reject(e)}}else if(status==='CHANNEL_ERROR'&&!done){done=true;clearTimeout(timer);reject(Error('Supabase Realtime channel error'))}else if(status==='TIMED_OUT'&&!done){done=true;clearTimeout(timer);reject(Error('Supabase Realtime timed out'))}})});}function scanPeers(){if(!s.channel||s.connected)return;const ps=s.channel.presenceState();const candidates=[];Object.values(ps).forEach(arr=>arr.forEach(p=>{if(p.clientId&&p.clientId!==clientId&&(!s.country||s.country==='any'||p.country===s.country||p.cou
