l></button></div>`).join('')}</div></div></div>`)}function closeShare(){document.getElementById('shareModal')?.remove()}async function copyShareLink(){const i=document.getElementById('shareLink');try{await navigator.clipboard.writeText(i.value);toast('Link copied')}catch(e){i.select();document.execCommand('copy');toast('Link copied')}}async function shareNative(){const url=document.getElementById('shareLink')?.value||siteUrl();try{if(navigator.share)await navigator.share({title:'World Connect',text:shareText(url===siteUrl()?'site':'live'),url});else toast('Native sharing is not supported here')}catch(e){if(e.name!=='AbortError')toast('Sharing failed')}}function social(url){window.open(url,'_blank','noopener,noreferrer');}async function connectPeer(p){if(s.pc)return;s.pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]});s.remote=new MediaStream();s.ice=[];s.pc.ontrack=e=>{(e.streams[0]||new MediaStream([e.track])).getTracks().forEach(t=>{if(!s.remote.getTracks().includes(t))s.remote.addTrack(t)});s.connected=true;s.searching=false;render()};s.pc.onicecandidate=e=>{if(e.candidate)sendSignal({type:'ice',candidate:e.candidate})};s.pc.onconnectionstatechange=()=>{if(['failed','disconnected'].includes(s.pc.connectionState)){s.connected=false;toast('Connection ended');render()}};s.stream.getTracks().forEach(t=>s.pc.addTrack(t,s.stream));const initiator=clientId<p.clientId;if(initiator){const offer=await s.pc.createOffer();await s.pc.setLocalDescription(offer);await sendSignal({type:'offer',sdp:offer})}}async function sendSignal(d){if(s.channel&&s.peer)await s.channel.send({type:'broadcast',event:'signal',payload:{...d,from:clientId,to:s.peer.clientId}})}async function handleSignal(p){try{if(p.type==='offer'){if(!s.peer)s.peer={clientId:p.from,country:'Global'};if(!s.pc)await connectPeer(s.peer);await s.pc.setRemoteDescription(p.sdp);while(s.ice.length)await s.pc.addIceCandidate(s.ice.shift());const a=await s.
