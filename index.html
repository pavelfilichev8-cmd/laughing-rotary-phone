at()">Send</button></div></div></div>`}async function attach(){if(s.page==='call'){if(s.stream){const v=document.getElementById('lv');if(v)v.srcObject=s.stream}if(s.remote){const v=document.getElementById('rv');if(v)v.srcObject=s.remote}}}async function media(){if(s.stream)return s.stream;if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera API unavailable');s.stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});return s.stream}async function toggleSearch(){if(s.searching||s.connected){await hangup();return}try{await media();s.page='call';s.searching=true;render();await channel();await find()}catch(e){s.searching=false;render();toast('Allow camera and microphone to continue')}}async function channel(){if(s.channel)return;s.channel=db.channel('world-connect-roulette',{config:{presence:{key:clientId}}});s.channel.on('presence',{event:'sync'},scan);s.channel.on('broadcast',{event:'signal'},async({payload})=>{if(payload?.to===clientId)await signal(payload)});s.channel.on('broadcast',{event:'chat'},({payload})=>{if(payload?.to===clientId){s.chat.push({text:payload.text,me:false});render()}});const r=await s.channel.subscribe(async st=>{if(st==='SUBSCRIBED')await s.channel.track({clientId,country:s.country,language:s.lang,online:true})});if(r!=='SUBSCRIBED')throw Error('Realtime unavailable')}async function find(){try{const {data}=await db.rpc('wvr_find_match',{p_client_id:clientId,p_country:s.country,p_language:s.lang});if(data?.[0])s.peer={clientId:data[0].peer_client_id,country:data[0].peer_country,language:data[0].peer_language}}catch(e){}scan()}function scan(){if(!s.channel||s.connected)return;const ps=s.channel.presenceState(),all=[];Object.values(ps).forEach(a=>a.forEach(p=>{if(p.clientId&&p.clientId!==clientId&&(!s.country||s.country==='any'||p.country===s.country||p.country==='any'))all.push(p)}));if(!all.length)return;const p=all.sort((a,b)=>String(a.clientId).localeCompare(String(b.clientId)))[0];s.peer=p;s.searching=false;render();
