<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Connect — Video Roulette</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07101d;--panel:#0d192b;--line:#263852;--text:#f5f8ff;--muted:#9aabc3;--a:#7357ff;--b:#20d9ff;--ok:#39e58a;--bad:#ff5e73}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#24306b,transparent 35%),radial-gradient(circle at 90% 10%,#123d51,transparent 32%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1400px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b))}.nav{display:flex;gap:7px;flex-wrap:wrap}.btn,.nav button{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#0b1424;color:var(--text);font-weight:700}.primary{border:0;background:linear-gradient(135deg,var(--a),#4c98ff)}.danger{background:var(--bad);border:0}.layout{display:grid;grid-template-columns:270px 1fr;gap:14px;margin-top:14px}.card{background:#0b1626ee;border:1px solid var(--line);border-radius:20px}.side{padding:16px}.main{min-height:700px;overflow:hidden}.hero{padding:48px}.hero h1{font-size:clamp(44px,6vw,80px);line-height:.95;letter-spacing:-4px;margin:18px 0}.hero h1 span{background:linear-gradient(90deg,#a88dff,#35dcff);background-clip:text;color:transparent}.hero p{color:var(--muted);max-width:760px;line-height:1.65;font-size:17px}.label{display:block;color:var(--muted);font-size:11px;margin:13px 0 6px;letter-spacing:.08em}.select,.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#070e19;color:white;outline:none}.status{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#080f1b;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;background:#080f1b;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:18px;margin-bottom:4px}.muted{color:var(--muted)}.call{display:grid;grid-template-columns:1fr 330px;gap:12px;padding:12px}.stage{position:relative;min-height:650px;background:#02050a;border:1px solid var(--line);border-radius:16px;overflow:hidden}.remote{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;background:#02050a}.local{position:absolute;right:16px;bottom:75px;width:220px;height:150px;border-radius:14px;overflow:hidden;border:2px solid #fff4;background:#101827;z-index:3}.local video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.topline{position:absolute;z-index:4;left:14px;right:14px;top:14px;display:flex;justify-content:space-between}.pill{background:#050914dd;border:1px solid #fff2;border-radius:99px;padding:8px 11px}.caption{position:absolute;z-index:4;left:7%;right:7%;bottom:66px;text-align:center;background:#000b;border-radius:12px;padding:9px;min-height:24px;font-weight:700}.controls{position:absolute;z-index:5;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:7px}.ctl{width:44px;height:44px;border-radius:50%;border:1px solid #fff2;background:#111b2bdd;color:white}.chat{min-height:650px;display:flex;flex-direction:column;padding:10px}.msgs{flex:1;overflow:auto;background:#070d17;border:1px solid var(--line);border-radius:12px;padding:9px}.msg{display:flex;margin:7px 0}.msg.me{justify-content:flex-end}.bubble{max-width:90%;padding:9px 11px;border-radius:12px;background:#182640}.me .bubble{background:#4d3ac0}.composer{display:flex;gap:7px;margin-top:8px}.composer .input{flex:1}.notice{padding:14px;border:1px solid var(--line);border-radius:14px;background:#080f1b;margin-top:15px}.toast{position:fixed;right:18px;bottom:18px;z-index:99;padding:12px 15px;border-radius:12px;background:#111d31;border:1px solid var(--line);box-shadow:0 15px 50px #0008}.error{color:#ff98a6}.footer{text-align:center;color:var(--muted);padding:15px}.hidden{display:none}@media(max-width:1000px){.layout{grid-template-columns:1fr}.call{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.hero{padding:26px}.grid{grid-template-columns:1fr}.local{width:145px;height:100px}.stage{min-height:500px}}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL='https://lhquumfnuyjwzwcaskoi.supabase.co';
const SUPABASE_KEY='sb_publishable_gs7j4qK0xnsS9VYGMMgHg_IH8TXoHo';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:{params:{eventsPerSecond:30}}});
const id=sessionStorage.wcClientId||(sessionStorage.wcClientId=crypto.randomUUID());
const langs=[['en','English'],['ru','Русский'],['es','Español'],['de','Deutsch'],['fr','Français'],['fi','Suomi'],['it','Italiano'],['pt','Português'],['tr','Türkçe'],['ar','العربية'],['hi','हिन्दी'],['zh-CN','中文'],['ja','日本語'],['ko','한국어'],['pl','Polski'],['uk','Українська']];
let state={page:'home',lang:'en',to:'en',country:'any',status:'Ready',searching:false,connected:false,stream:null,remote:null,pc:null,lobby:null,match:null,matchCh:null,chat:[],caption:'',mic:true,cam:true,partner:null,recognition:null,joining:false};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)};
const setStatus=x=>{state.status=x;render();};
function render(){document.getElementById('app').innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo">✦</div><div>World Connect<div class="muted" style="font-size:12px;font-weight:400">Realtime video roulette</div></div></div><div class="nav"><button onclick="page('home')">Home</button><button onclick="page('call')">Video</button><button onclick="page('settings')">Settings</button></div></header><div class="layout"><aside class="card side"><b>Match settings</b><label class="label">SPOKEN LANGUAGE</label><select class="select" onchange="state.lang=this.value">${langs.map(x=>`<option value="${x[0]}" ${x[0]===state.lang?'selected':''}>${x[1]}</option>`).join('')}</select><label class="label">CAPTION / TRANSLATION</label><select class="select" onchange="state.to=this.value">${langs.map(x=>`<option value="${x[0]}" ${x[0]===state.to?'selected':''}>${x[1]}</option>`).join('')}</select><button class="btn primary" style="width:100%;margin-top:15px" onclick="startRoulette()">${state.searching?'⏳ Searching…':'🌍 Find a stranger'}</button><button class="btn" style="width:100%;margin-top:8px" onclick="nextPeer()">⏭ Next</button><button class="btn danger" style="width:100%;margin-top:8px" onclick="hangup()">☎ Hang up</button><div class="status"><b>${state.connected?'🟢 Connected':state.searching?'🟡 Searching':state.status}</b><br><span class="muted">Session ${id.slice(0,12)}…</span>${state.partner?`<br>Peer ${state.partner.slice(0,12)}…`:''}</div></aside><main class="card main">${body()}</main></div><div class="footer">WebRTC • Supabase Realtime • no recording</div></div>`;attachVideo();}
function page(p){state.page=p;render()}
function body(){if(state.page==='home')return `<section class="hero"><div class="muted">FREE GLOBAL VIDEO ROULETTE</div><h1>Meet someone <span>anywhere.</span></h1><p>Two users enter the same realtime lobby. Supabase Presence pairs them, then a private Realtime channel carries WebRTC offer, answer and ICE candidates.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin:24px 0"><button class="btn primary" onclick="startRoulette()">🎥 Start roulette</button><button class="btn" onclick="page('settings')">⚙ Settings</button></div><div class="grid"><div class="stat"><b>WebRTC</b><span class="muted">Peer video + audio</span></div><div class="stat"><b>Supabase</b><span class="muted">Presence + signaling + chat</span></div><div class="stat"><b>Next</b><span class="muted">Clean disconnect and rematch</span></div></div><div class="notice"><b>Two-browser test</b><br><span class="muted">Open this URL in two different browsers or devices, allow camera/microphone, and press Find a stranger in both.</span></div></section>`;if(state.page==='settings')return `<section class="hero"><h2>Browser settings</h2><p class="muted">Camera and microphone require HTTPS and explicit browser permission. STUN is enabled for NAT traversal.</p><div class="notice">Speech recognition and speech synthesis are enabled when your browser supports the Web Speech API.</div><div class="notice"><b>Connection diagnostics</b><br>Supabase: ${db?'loaded':'missing'}<br>Client ID: ${id}<br>WebRTC: ${window.RTCPeerConnection?'available':'not available'}</div></section>`;return callPage()}
function callPage(){return `<div class="call"><div class="stage"><div class="topline"><div class="pill">${state.connected?'🟢 WebRTC connected':state.searching?'🟡 Waiting for peer':'⚪ Ready'}</div><div class="pill">${state.partner?'Peer '+esc(state.partner.slice(0,8)):'No peer'}</div></div><video id="remote" class="remote" autoplay playsinline></video><div class="local"><video id="local" autoplay muted playsinline></video></div><div class="caption">${esc(state.caption)}</div><div class="controls"><button class="ctl" onclick="toggleMic()">${state.mic?'🎙':'🔇'}</button><button class="ctl" onclick="toggleCam()">${state.cam?'📷':'🚫'}</button><button class="ctl" onclick="startSpeech()">🗣</button><button class="ctl" onclick="nextPeer()">⏭</button><button class="ctl" onclick="hangup()">☎</button></div></div><div class="chat"><b>Realtime chat</b><div class="muted" style="font-size:12px;margin:6px 0">${state.connected?'Connected':'Waiting for match'}</div><div class="msgs">${state.chat.map(m=>`<div class="msg ${m.me?'me':''}"><div class="bubble">${esc(m.text)}${m.translation?`<div class="muted" style="font-size:12px;margin-top:5px">${esc(m.translation)}</div>`:''}</div></div>`).join('')}</div><div class="composer"><input id="chat" class="input" placeholder="Message…" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn primary" onclick="sendChat()">Send</button></div></div></div>`}
async function attachVideo(){if(state.page!=='call')return;let l=document.getElementById('local'),r=document.getElementById('remote');if(l&&state.stream)l.srcObject=state.stream;if(r&&state.remote)r.srcObject=state.remote;try{if(l)await l.play();if(r)await r.play()}catch(e){}}
async function media(){if(state.stream)return state.stream;try{state.stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});return state.stream}catch(e){toast('Camera/microphone permission is required: '+e.message);throw e}}
async function startRoulette(){try{await media();page('call');state.searching=true;state.connected=false;state.partner=null;state.status='Searching';await joinLobby()}catch(e){state.searching=false;state.status='Permission denied';render()}}
async function joinLobby(){if(state.lobby)return;state.lobby=db.channel('wc-lobby-v2',{config:{presence:{key:id}}});state.lobby.on('presence',{event:'sync'},pairFromPresence);state.lobby.on('presence',{event:'join'},pairFromPresence);state.lobby.on('presence',{event:'leave'},()=>{if(state.partner)nextPeer(false)});let res=await state.lobby.subscribe(async status=>{if(status==='SUBSCRIBED'){await state.lobby.track({id,lang:state.lang,country:state.country,searching:true,ts:Date.now()});pairFromPresence()}});if(res!=='SUBSCRIBED')throw Error('Supabase Realtime subscribe failed')}
function pairFromPresence(){if(!state.lobby||!state.searching)return;let all=state.lobby.presenceState();let ids=Object.keys(all).filter(x=>x!==id).sort();let everyone=[id,...ids].sort();let i=everyone.indexOf(id);let partner=(i%2===0&&everyone[i+1])?everyone[i+1]:(i%2===1?everyone[i-1]:null);if(partner&&partner!==state.partner)connectTo(partner)}
async function connectTo(partner){if(state.joining||state.partner===partner)return;state.joining=true;state.partner=partner;state.searching=false;state.status='Connecting';state.match= [id,partner].sort().join('-');if(state.matchCh)await state.matchCh.unsubscribe();state.matchCh=db.channel('wc-match-'+state.match,{config:{broadcast:{ack:true}}});state.matchCh.on('broadcast',{event:'signal'},async({payload})=>{if(payload.from===id)return;await onSignal(payload)});state.matchCh.on('broadcast',{event:'chat'},async({payload})=>{if(payload.from===id)return;state.chat.push({me:false,text:payload.text});render();translateIncoming(state.chat.length-1)});await state.matchCh.subscribe(async status=>{if(status!=='SUBSCRIBED'){toast('Match channel failed');return}await setupPeer();if(id<partner)await makeOffer()});}
async function setupPeer(){if(state.pc)state.pc.close();state.remote=new MediaStream();state.pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]});state.stream.getTracks().forEach(t=>state.pc.addTrack(t,state.stream));state.pc.ontrack=e=>{e.streams[0]?.getTracks().forEach(t=>{if(!state.remote.getTracks().some(x=>x.id===t.id))state.remote.addTrack(t)});state.connected=true;state.status='Connected';render()};state.pc.onicecandidate=e=>{if(e.candidate)sendSignal({type:'ice',candidate:e.candidate})};state.pc.onconnectionstatechange=()=>{let c=state.pc.connectionState;if(c==='connected'){state.connected=true;state.status='Connected';render()}if(['failed','disconnected','closed'].includes(c)){state.connected=false;if(c==='failed')toast('WebRTC failed — press Next to retry');render()}};state.pc.oniceconnectionstatechange=()=>{if(state.pc.iceConnectionState==='failed')state.pc.restartIce?.()}}
async function sendSignal(x){if(state.matchCh)await state.matchCh.send({type:'broadcast',event:'signal',payload:{...x,from:id}})}
async function makeOffer(){if(!state.pc)return;let offer=await state.pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:true});await state.pc.setLocalDescription(offer);await sendSignal({type:'offer',sdp:offer})}
async function onSignal(p){if(!state.pc)return;if(p.type==='offer'){await state.pc.setRemoteDescription(p.sdp);let answer=await state.pc.createAnswer();await state.pc.setLocalDescription(answer);await sendSignal({type:'answer',sdp:answer})}else if(p.type==='answer'){if(!state.pc.currentRemoteDescription)await state.pc.setRemoteDescription(p.sdp)}else if(p.type==='ice'&&p.candidate){try{await state.pc.addIceCandidate(p.candidate)}catch(e){console.warn(e)}}}
async function sendChat(){let input=document.getElementById('chat');let text=input?.value.trim();if(!text||!state.matchCh)return;state.chat.push({me:true,text});input.value='';render();await state.matchCh.send({type:'broadcast',event:'chat',payload:{from:id,text}});translateIncoming(state.chat.length-1)}
async function translateIncoming(index){let m=state.chat[index];if(!m||state.to===state.lang)return;try{let url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(m.text)+'&langpair='+encodeURIComponent(state.lang+'|'+state.to);let r=await fetch(url);let j=await r.json();m.translation=j?.responseData?.translatedText||'';render()}catch(e){}}
async function nextPeer(rejoin=true){await cleanupPeer();state.partner=null;state.match=null;state.searching=false;state.connected=false;state.status='Ready';if(rejoin){state.searching=true;state.status='Searching';page('call');await joinLobby();if(state.lobby)await state.lobby.track({id,lang:state.lang,country:state.country,searching:true,ts:Date.now()})}else render()}
async function cleanupPeer(){if(state.pc){state.pc.ontrack=null;state.pc.onicecandidate=null;state.pc.close();state.pc=null}state.connected=false;state.remote=null;if(state.matchCh){await state.matchCh.unsubscribe();state.matchCh=null}}
async function hangup(){await cleanupPeer();if(state.lobby){await state.lobby.untrack();await state.lobby.unsubscribe();state.lobby=null}state.searching=false;state.partner=null;state.status='Ready';page('home')}
function toggleMic(){if(!state.stream)return;state.mic=!state.mic;state.stream.getAudioTracks().forEach(t=>t.enabled=state.mic);render()}
function toggleCam(){if(!state.stream)return;state.cam=!state.cam;state.stream.getVideoTracks().forEach(t=>t.enabled=state.cam);render()}
function startSpeech(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('Speech recognition is not supported by this browser');return}if(state.recognition){state.recognition.stop();state.recognition=null;return}let r=new R();r.lang=state.lang;r.continuous=true;r.interimResults=true;r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;state.caption=t;render();if(e.results[e.results.length-1].isFinal&&state.to){speak(t,state.to)}};r.onerror=e=>toast('Speech recognition: '+e.error);r.onend=()=>{state.recognition=null};state.recognition=r;r.start();toast('Live speech captions started')}
function speak(text,lang){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(text);u.lang=lang;speechSynthesis.cancel();speechSynthesis.speak(u)}
window.addEventListener('beforeunload',()=>{try{state.pc?.close();state.lobby?.untrack()}catch(e){}});
render();
</script></body></html>
