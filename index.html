<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Connect Roulette</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07101d;color:#f5f8ff;font:15px system-ui}.app{max-width:1200px;margin:auto;padding:20px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:1px solid #30425e;border-radius:12px;padding:11px 15px;background:#101c2f;color:#fff;cursor:pointer;font-weight:700}.primary{background:#6b55ff;border:0}.danger{background:#d94158;border:0}.layout{display:grid;grid-template-columns:240px 1fr;gap:14px;margin-top:15px}.card{background:#0c1829;border:1px solid #263852;border-radius:18px}.side{padding:15px}.main{min-height:700px;padding:12px}.status,.diag{margin-top:12px;padding:12px;border:1px solid #263852;border-radius:12px;color:#9aabc3;line-height:1.6}.diag{white-space:pre-wrap;font:12px monospace;background:#050b14}.videos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.videoBox{position:relative;background:#02050a;border-radius:14px;overflow:hidden;min-height:420px}.videoBox video{width:100%;height:100%;min-height:420px;object-fit:cover}.tag{position:absolute;top:10px;left:10px;background:#000b;padding:7px 10px;border-radius:99px;z-index:2}.chat{margin-top:10px}.msgs{height:130px;overflow:auto;border:1px solid #263852;border-radius:12px;padding:8px}.msg{margin:6px;padding:8px;background:#182640;border-radius:10px}.me{text-align:right;background:#493bb2}.row{display:flex;gap:7px;margin-top:7px}.input{flex:1;padding:11px;border:1px solid #30425e;border-radius:10px;background:#07101d;color:#fff}.hero{padding:35px}.hero h1{font-size:clamp(42px,7vw,78px);margin:15px 0;line-height:.95}.muted{color:#9aabc3}@media(max-width:800px){.layout,.videos{grid-template-columns:1fr}.videoBox,.videoBox video{min-height:300px}}</style></head><body><div id="app"></div><script>
const URL='https://lhquumfnuyjwzwcaskoi.supabase.co',KEY='sb_publishable_gs7j4qK0xnsS9VYGMMgHg_IH8TXoHo';const sb=supabase.createClient(URL,KEY,{realtime:{params:{eventsPerSecond:50}}});const ID=sessionStorage.wcId||(sessionStorage.wcId=crypto.randomUUID());let lobby=null,signal=null,pc=null,localStream=null,remoteStream=null,partner=null,searching=false,connected=false,queued=[],chat=[],status='Ready';const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function diag(x){if($('diag'))$('diag').textContent=x}function app(){document.getElementById('app').innerHTML=`<div class="app"><div class="bar"><h2>🌍 World Connect Roulette</h2><div><button class="btn" onclick="diagnostics()">Diagnostics</button> <button class="btn danger" onclick="hangup()">Hang up</button></div></div><div class="layout"><aside class="card side"><b>Find a stranger</b><p class="muted">Open this page in two different browsers/devices and press Find in both.</p><button class="btn primary" style="width:100%" onclick="find()">${searching?'⏳ Searching…':'🎥 Find stranger'}</button><button class="btn" style="width:100%;margin-top:8px" onclick="next()">⏭ Next</button><div class="status"><b>${connected?'🟢 Connected':searching?'🟡 Searching':'⚪ '+status}</b><br>ID: ${ID.slice(0,10)}…<br>${partner?'Peer: '+partner.slice(0,10)+'…':''}</div><div id="diag" class="diag">Supabase: checking…\nPresence: not started\nWebRTC: idle</div></aside><main class="card main"><div class="videos"><div class="videoBox"><span class="tag">YOU</span><video id="local" autoplay muted playsinline></video></div><div class="videoBox"><span class="tag">STRANGER</span><video id="remote" autoplay playsinline></video></div></div><div class="chat"><b>Chat</b><div id="msgs" class="msgs">${chat.map(m=>`<div class="msg ${m.me?'me':''}">${esc(m.text)}</div>`).join('')}</div><div class="row"><input id="text" class="input" placeholder="Message…" onkeydown="if(event.key==='Enter')send()"><button class="btn primary" onclick="send()">Send</button></div></div></main></div></div>`;if(localStream)$('local').srcObject=localStream;if(remoteStream)$('remote').srcObject=remoteStream}async function find(){try{await media();searching=true;connected=false;partner=null;status='Searching';app();await lobbyStart()}catch(e){searching=false;status=e.message;app()}}async function media(){if(localStream)return;localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});app()}async function lobbyStart(){if(lobby){await lobby.track({id:ID,searching:true,ts:Date.now()});return}lobby=sb.channel('world-connect-lobby-v5',{config:{presence:{key:ID}}});lobby.on('presence',{event:'sync'},pair);lobby.on('presence',{event:'join'},pair);lobby.on('presence',{event:'leave'},()=>{if(partner)resetToSearch()});const s=await lobby.subscribe(async x=>{diag('Supabase: '+x+'\nPresence: '+(x==='SUBSCRIBED'?'ready':'waiting'));if(x==='SUBSCRIBED'){await lobby.track({id:ID,searching:true,ts:Date.now()});pair()}});if(s!=='SUBSCRIBED')throw Error('Supabase Realtime subscribe failed')}function pair(){if(!searching||!lobby||partner)return;const keys=Object.keys(lobby.presenceState()).filter(k=>k!==ID).sort();if(!keys.length){diag('Supabase: connected\nPresence: searching\nWaiting for second browser…');return}const all=[ID,...keys].sort();const i=all.indexOf(ID);const p=i%2===0?all[i+1]:all[i-1];if(p)connect(p)}async function connect(p){if(partner)return;partner=p;searching=false;status='Connecting';app();const room='world-connect-match-'+[ID,p].sort().join('-');signal=sb.channel(room,{config:{broadcast:{ack:true,self:false}}});signal.on('broadcast',{event:'signal'},e=>onSignal(e.payload));signal.on('broadcast',{event:'chat'},e=>{if(e.payload.from!==ID){chat.push({text:e.payload.text,me:false});app()}});const s=await signal.subscribe();if(s!=='SUBSCRIBED'){status='Signaling failed';app();return}await makePC();if(ID<p)await offer();else{status='Waiting for offer';app()}}async function makePC(){if(pc)pc.close();queued=[];remoteStream=new MediaStream();pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]});for(const t of localStream.getTracks())pc.addTrack(t,localStream);pc.ontrack=e=>{for(const t of e.streams[0]?.getTracks()||[])if(!remoteStream.getTracks().some(x=>x.id===t.id))remoteStream.addTrack(t);if($('remote'))$('remote').srcObject=remoteStream};pc.onicecandidate=e=>{if(e.candidate&&partner)signal.send({type:'broadcast',event:'signal',payload:{from:ID,to:partner,type:'ice',candidate:e.candidate.toJSON()}})};pc.onconnectionstatechange=()=>{const s=pc.connectionState;diag('Supabase: connected\nPresence: matched\nWebRTC: '+s);if(s==='connected'){connected=true;status='Connected';app()}if(['failed','closed'].includes(s)){connected=false;status='WebRTC '+s;app()}}}async function offer(){const o=await pc.createOffer();await pc.setLocalDescription(o);await signal.send({type:'broadcast',event:'signal',payload:{from:ID,to:partner,type:'offer',sdp:o}});status='Offer sent';app()}async function onSignal(m){if(m.from===ID||m.to!==ID)return;try{if(m.type==='offer'){if(!pc)await makePC();await pc.setRemoteDescription(m.sdp);for(const c of queued)await pc.addIceCandidate(c);queued=[];const a=await pc.createAnswer();await pc.setLocalDescription(a);await signal.send({type:'broadcast',event:'signal',payload:{from:ID,to:partner,type:'answer',sdp:a}})}else if(m.type==='answer'){await pc.setRemoteDescription(m.sdp);for(const c of queued)await pc.addIceCandidate(c);queued=[]}else if(m.type==='ice'){const c=new RTCIceCandidate(m.candidate);if(pc.remoteDescription)await pc.addIceCandidate(c);else queued.push(c)}}catch(e){status='Signaling error: '+e.message;app()}}function send(){const e=$('text'),t=e?.value.trim();if(!t||!signal)return;e.value='';chat.push({text:t,me:true});signal.send({type:'broadcast',event:'chat',payload:{from:ID,text:t}});app()}async function resetToSearch(){if(signal){await signal.unsubscribe();signal=null}if(pc){pc.close();pc=null}partner=null;connected=false;queued=[];status='Searching';searching=true;app();await lobbyStart()}async function next(){await resetToSearch()}async function hangup(){searching=false;if(signal)await signal.unsubscribe();signal=null;if(pc){pc.close();pc=null}partner=null;connected=false;status='Ready';app()}function diagnostics(){diag(`Supabase: ${sb?'loaded':'missing'}\nPresence: ${lobby?'active':'not started'}\nWebRTC: ${window.RTCPeerConnection?'available':'unavailable'}\nCamera: ${localStream?'granted':'not requested'}\nPeer: ${partner||'none'}\nConnection: ${pc?.connectionState||'idle'}`)}app();
</script></body></html>
