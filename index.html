<style>
:root{--bg:#060914;--p:#0d1425;--p2:#111b30;--line:#25304a;--txt:#f5f7fb;--muted:#91a0ba;--a:#765cff;--b:#25d7ff;--ok:#42e695;--danger:#ff6078}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1b245d,transparent 35%),var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1400px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 10px 30px #5267ff55}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.ghost{background:#0a1020;border:1px solid var(--line);color:#d6dcef;padding:9px 12px;border-radius:10px}.nav .on,.primary{background:linear-gradient(135deg,var(--a),#4b8cff);border-color:transparent;color:#fff}.layout{display:grid;grid-template-columns:290px 1fr;gap:14px}.card{background:#0c1324e8;border:1px solid var(--line);border-radius:19px;box-shadow:0 20px 60px #0006}.side{padding:16px}.main{min-height:700px;overflow:hidden}.hero{padding:30px}.hero h1{font-size:clamp(35px,5vw,66px);line-height:.98;letter-spacing:-3px;margin:14px 0}.hero h1 span{background:linear-gradient(90deg,#9c80ff,#35d8ff);color:transparent;background-clip:text}.muted{color:var(--muted)}.small{font-size:12px}.label{display:block;color:var(--muted);font-size:12px;margin:7px 0}.field{margin:14px 0}.input,.select{width:100%;padding:11px;border:1px solid var(--line);background:#070c18;color:#fff;border-radius:11px;outline:0}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:750}.actions{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.item,.notice{background:#080e1c;border:1px solid var(--line);border-radius:13px;padding:13px}.stat b{font-size:19px;display:block}.video{display:grid;grid-template-columns:1fr 310px;gap:10px;padding:12px}.stage{position:relative;min-height:620px;background:#02040a;border-radius:16px;overflow:hidden;border:1px solid var(--line)}video{width:100%;height:100%;object-fit:cover}.remote{position:absolute;inset:0}.local{position:absolute;right:14px;bottom:15px;width:190px;height:130px;border:2px solid #fff3;border-radius:13px;overflow:hidden;box-shadow:0 12px 35px #0009}.local video{transform:scaleX(-1)}.pill{background:#030611c9;border:1px solid #fff2;padding:7px 10px;border-radius:99px;backdrop-filter:blur(10px)}.stageTop{position:absolute;z-index:3;top:13px;left:13px;right:13px;display:flex;justify-content:space-between}.sub{position:absolute;z-index:4;bottom:30px;left:7%;right:7%;text-align:center;background:#0009;padding:9px;border-radius:11px;font-size:18px;font-weight:700}.controls{position:absolute;z-index:5;bottom:13px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.ctl{width:43px;height:43px;border-radius:50%;background:#11192bdd;color:#fff;border:1px solid #fff2}.chat{display:flex;flex-direction:column;min-height:620px;padding:10px}.msgs{flex:1;overflow:auto;padding:9px;background:#070c17;border-radius:12px}.msg{display:flex;margin:7px 0}.msg.me{justify-content:flex-end}.bubble{max-width:85%;padding:9px 11px;border-radius:12px;background:#16213a}.me .bubble{background:#4d3bc1}.composer{display:flex;gap:7px;margin-top:8px}.composer .input{flex:1}.toast{position:fixed;right:18px;bottom:18px;padding:12px 14px;border:1px solid var(--line);background:#121b30;border-radius:12px;z-index:99}.badge{border:1px solid var(--line);padding:5px 9px;border-radius:99px;font-size:11px;color:#cbd5e8}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}.footer{text-align:center;color:var(--muted);padding:14px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.video{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1}.grid{grid-template-columns:1fr}.hero{padding:20px}.stage{min-height:430px}.local{width:130px;height:90px}}
</style>
</head>
<body><div id="app"></div>
<script>
const URL='https://lhquumfnuyjwzwcaskoi.supabase.co',KEY='sb_publishable_gs7j4qJk0xnsS9VYGMMgHg_IH8TXoHo',db=supabase.createClient(URL,KEY);
const id=localStorage.wvrId||(localStorage.wvrId=crypto.randomUUID());
const langs=[['any','Any'],['en','English'],['ru','Русский'],['es','Español'],['fr','Français'],['de','Deutsch'],['it','Italiano'],['pt','Português'],['uk','Українська'],['pl','Polski'],['tr','Türkçe'],['ar','العربية'],['he','עברית'],['fa','فارسی'],['hi','हिन्दी'],['zh-CN','中文简体'],['zh-TW','中文繁體'],['ja','日本語'],['ko','한국어'],['vi','Tiếng Việt'],['th','ไทย'],['id','Bahasa Indonesia'],['nl','Nederlands'],['sv','Svenska'],['fi','Suomi'],['no','Norsk'],['da','Dansk'],['cs','Čeština'],['hu','Magyar'],['ro','Română'],['bg','Български'],['el','Ελληνικά'],['ka','ქართული'],['kk','Қазақша'],['uz','O‘zbek'],['sw','Kiswahili'],['af','Afrikaans'],['am','አማርኛ'],['ne','नेपाली'],['ta','தமிழ்'],['te','తెలుగు'],['bn','বাংলা'],['ur','اردو'],['ms','Bahasa Melayu'],['tl','Filipino'],['ca','Català'],['eu','Euskara'],['gl','Galego'],['is','Íslenska'],['ga','Gaeilge'],['cy','Cymraeg'],['zu','isiZulu'],['yo','Yorùbá'],['ig','Igbo']];
const countries=[['any','🌍 Any country'],['FI','🇫🇮 Finland'],['DE','🇩🇪 Germany'],['FR','🇫🇷 France'],['GB','🇬🇧 UK'],['US','🇺🇸 USA'],['CA','🇨🇦 Canada'],['ES','🇪🇸 Spain'],['IT','🇮🇹 Italy'],['NL','🇳🇱 Netherlands'],['SE','🇸🇪 Sweden'],['NO','🇳🇴 Norway'],['DK','🇩🇰 Denmark'],['PL','🇵🇱 Poland'],['UA','🇺🇦 Ukraine'],['RU','🇷🇺 Russia'],['TR','🇹🇷 Türkiye'],['AE','🇦🇪 UAE'],['IN','🇮🇳 India'],['JP','🇯🇵 Japan'],['KR','🇰🇷 Korea'],['CN','🇨🇳 China'],['BR','🇧🇷 Brazil'],['MX','🇲🇽 Mexico'],['AU','🇦🇺 Australia']];
let s={page:'home',country:'any',lang:'en',to:'en',queue:false,match:null,ch:null,pc:null,local:null,remote:null,mic:true,cam:true,sub:'',chat:[],turn:{url:'',user:'',pass:''}};
try{s.turn=JSON.parse(localStorage.wvrTurn)||s.turn}catch{}
const esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a])),lname=x=>langs.find(y=>y[0]==x)?.[1]||x;
const opts=(a,v)=>a.map(x=>'<option value="'+esc(x[0])+'" '+(x[0]==v?'selected':'')+'>'+esc(x[1])+'</option>').join('');
function toast(x){let e=document.createElement('div');e.className='toast';e.textContent=x;document.body.append(e);setTimeout(()=>e.remove(),2800)}
function render(){document.getElementById('app').innerHTML='<div class="wrap"><header class="top"><div class="brand"><div class="logo">✦</div><div>World Connect<div class="small muted">Free Video Roulette</div></div></div><nav class="nav">'+[['home','Home'],['call','Video'],['world','World'],['settings','Settings']].map(x=>'<button class="'+(s.page==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</nav></header><div class="layout"><aside class="card side">'+side()+'</aside><main class="card main">'+body()+'</main></div><div class="footer">WebRTC • Supabase Realtime • speech subtitles • no recording</div></div>';if(s.page==='call')bind()}
function side(){return '<span class="label">COUNTRY</span><select class="select" onchange="s.country=this.value">'+opts(countries,s.country)+'</select><span class="label">SPOKEN LANGUAGE</span><select class="select" onchange="s.lang=this.value">'+opts(langs.slice(1),s.lang)+'</select><span class="label">TRANSLATE TO</span><select class="select" onchange="s.to=this.value">'+opts(langs.slice(1),s.to)+'</select><div style="height:14px"></div><button class="btn primary" style="width:100%" onclick="toggleQueue()">'+(s.queue?'⏳ Searching…':'🌍 Find a stranger')+'</button><div style="height:12px"></div><div class="notice small"><span class="dot"></span>Guest session<br><span class="muted">'+id.slice(0,10)+'…</span></div>'}
function body(){if(s.page==='home')return '<section class="hero"><div class="badge">GLOBAL VIDEO ROULETTE • FREE MVP</div><h1>Meet someone <span>anywhere.</span></h1><p class="muted" style="font-size:16px;max-width:720px">Random 1-to-1 video calls with realtime matching, text chat and browser speech subtitles. Open this page in two browsers to test a real WebRTC connection.</p><div class="actions"><button class="btn primary" onclick="toggleQueue()">🎥 Start roulette</button><button class="btn" onclick="go(\'settings\')">Network settings</button></div><div style="height:20px"></div><div class="grid"><div class="stat"><b>WebRTC</b><span class="muted">peer video/audio</span></div><div class="stat"><b>Realtime</b><span class="muted">matching + chat</span></div><div class="stat"><b>Speech</b><span class="muted">live subtitles</span></div></div></section><section style="padding:18px"><div class="notice"><b>Free stack</b><br><span class="muted">Supabase Free for signaling/matching + browser Web Speech for subtitles. A TURN server is optional but recommended for difficult networks.</span></div></section>';if(s.page==='call')return call();if(s.page==='world')return '<section style="padding:20px"><h2>Discover</h2><p class="muted">Select a country and language, then press Find a stranger.</p><div class="grid">'+countries.slice(1).map(x=>'<div class="item"><b>'+esc(x[1])+'</b><div class="small muted">Global matching</div></div>').join('')+'</div></section>';return settings()}
function call(){return '<div class="video"><div class="stage"><div class="stageTop"><div class="pill">'+(s.match?'🟢 Connected':'🟡 Searching')+'</div><div class="pill">'+(s.match?esc(lname(s.match.peer_language)):'Waiting…')+'</div></div><video id="rv" class="remote" autoplay playsinline></video><div class="local"><video id="lv" autoplay muted playsinline></video></div><div class="sub">'+esc(s.sub)+'</div><div class="controls"><button class="ctl" onclick="mic()">'+(s.mic?'🎙️':'🔇')+'</button><button class="ctl" onclick="cam()">'+(s.cam?'📷':'🚫')+'</button><button class="ctl" onclick="speech()">🗣️</button><button class="ctl" onclick="next()">⏭️</button><button class="ctl" onclick="hang()">☎</button></div></div><div class="chat"><b>Realtime chat</b><div class="small muted" style="margin:5px 0 8px">Translation: '+esc(lname(s.to))+'</div><div class="msgs" id="msgs">'+s.chat.map(m=>'<div class="msg '+(m.me?'me':'')+'"><div class="bubble">'+esc(m.t)+(m.tr&&m.tr!=m.t?'<div class="small muted">↳ '+esc(m.tr)+'</div>':'')+'</div></div>').join('')+'</div><div class="composer"><input id="ci" class="input" placeholder="Message…" onkeydown="if(event.key==\'Enter\')chat()"><button class="btn primary" onclick="chat()">Send</button></div></div></div>'}
function settings(){return '<section style="padding:20px"><h2>Translation & Network</h2><div class="grid"><div class="item"><b>Speech language</b><select class="select" onchange="s.lang=this.value">'+opts(langs.slice(1),s.lang)+'</select></div><div class="item"><b>Subtitle language</b><select class="select" onchange="s.to=this.value">'+opts(langs.slice(1),s.to)+'</select></div><div class="item"><b>Speech</b><p class="small muted">Web Speech API + SpeechSynthesis</p></div></div><h3>TURN server</h3><div class="notice small">Use STUN/TURN for WebRTC. A normal browser page cannot force a global SOCKS5/HTTP proxy for media.</div><div class="grid"><div><span class="label">TURN URL</span><input class="input" id="tu" value="'+esc(s.turn.url)+'" placeholder="turn:host:3478"></div><div><span class="label">Username</span><input class="input" id="tuser" value="'+esc(s.turn.user)+'"></div><div><span class="label">Password</span><input class="input" id="tp" type="password" value="'+esc(s.turn.pass)+'"></div></div><button class="btn primary" onclick="save()">Save</button><h3>Safety</h3><div class="notice">No recording. Report/block can be added without changing the WebRTC layer. Use the Next button to leave a call.</div></section>'}
function go(p){s.page=p;render()}
async function toggleQueue(){if(s.queue){await db.rpc('wvr_leave_queue',{p_client_id:id});s.queue=false;render();return}s.queue=true;s.page='call';render();try{await media();find()}catch(e){s.queue=false;render();toast(e.message||'Camera/microphone permission required')}}
async function media(){if(s.local)return;s.local=await navigator.mediaDevices.getUserMedia({video:true,audio:true});bind()}
function bind(){let l=document.getElementById('lv'),r=document.getElementById('rv');if(l)l.srcObject=s.local;if(r&&s.remote)r.srcObject=s.remote;let m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight}
async function find(){let {data,error}=await db.rpc('wvr_find_match',{p_client_id:id,p_country:s.country,p_language:s.lang});if(error)throw error;if(data?.length){s.match=data[0];s.queue=false;await channel(data[0].match_id);render();setTimeout(()=>caller(),500)}else setTimeout(()=>s.queue&&find(),2200)}
async function channel(room){if(s.ch)await db.removeChannel(s.ch);s.ch=db.channel('wvr-'+room);s.ch.on('broadcast',{event:'signal'},async x=>signal(x.payload)).subscribe(()=>{})}
function ice(){let a=[{urls:'stun:stun.l.google.com:19302'}];if(s.turn.url)a.push({urls:s.turn.url,username:s.turn.user,credential:s.turn.pass});return a}
async function pc(){if(s.pc)return;s.pc=new RTCPeerConnection({iceServers:ice()});s.remote=new MediaStream();s.local.getTracks().forEach(t=>s.pc.addTrack(t,s.local));s.pc.ontrack=e=>e.streams[0]?.getTracks().forEach(t=>s.remote.addTrack(t));s.pc.onicecandidate=e=>e.candidate&&send({type:'candidate',candidate:e.candidate});s.pc.onconnectionstatechange=()=>{if(['failed','disconnected'].includes(s.pc.connectionState))toast('Connection interrupted')};bind()}
async function caller(){if(!s.match)return;await pc();if(id<s.match.peer_id){let o=await s.pc.createOffer();await s.pc.setLocalDescription(o);send({type:'offer',sdp:o})}}
async function send(x){if(s.ch)await s.ch.send({type:'broadcast',event:'signal',payload:{from:id,...x}})}
async function signal(p){if(!s.match||p.from==id)return;await pc();if(p.type=='offer'){await s.pc.setRemoteDescription(p.sdp);let a=await s.pc.createAnswer();await s.pc.setLocalDescription(a);send({type:'answer',sdp:a})}else if(p.type=='answer')await s.pc.setRemoteDescription(p.sdp);else if(p.type=='candidate'){try{await s.pc.addIceCandidate(p.candidate)}catch{}}else if(p.type=='chat'){let tr=await translate(p.text,s.match.peer_language,s.to);s.chat.push({t:p.text,tr,me:false});render()}else if(p.type=='hang')hang(false)}
async function translate(t,from,to){if(from==to)return t;try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair='+encodeURIComponent(from+'|'+to));let j=await r.json();return j?.responseData?.translatedText||t}catch{return t}}
function chat(){let i=document.getElementById('ci'),t=i?.value.trim();if(!t)return;i.value='';s.chat.push({t,tr:t,me:true});send({type:'chat',text:t});render()}
function mic(){s.mic=!s.mic;s.local?.getAudioTracks().forEach(t=>t.enabled=s.mic);render()}
function cam(){s.cam=!s.cam;s.local?.getVideoTracks().forEach(t=>t.enabled=s.cam);render()}
let rec=null;
function speech(){if(rec){rec.stop();rec=null;s.sub='';render();return}let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Speech recognition is not supported in this browser');rec=new R();rec.lang=s.lang;rec.continuous=true;rec.interimResults=true;rec.onresult=async e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;s.sub=e.results[e.results.length-1].isFinal?await translate(t,s.lang,s.to):t;render();};rec.onend=()=>{if(rec)try{rec.start()}catch{}};rec.start();toast('Live subtitles on')}
async function hang(send=true){if(send&&s.ch)await s.ch.send({type:'broadcast',event:'signal',payload:{from:id,type:'hang'}});if(rec){rec.stop();rec=null}if(s.pc){s.pc.close();s.pc=null}if(s.ch){await db.removeChannel(s.ch);s.ch=null}if(s.queue)await db.rpc('wvr_leave_queue',{p_client_id:id});s.queue=false;s.match=null;s.remote=null;s.page='home';render()}
async function next(){await hang(false);toggleQueue()}
function save(){s.turn={url:document.getElementById('tu').value.trim(),user:document.getElementById('tuser').value,pass:document.getElementById('tp').value};localStorage.wvrTurn=JSON.stringify(s.turn);toast('TURN settings saved')}
addEventListener('beforeunload',()=>{try{db.rpc('wvr_leave_queue',{p_client_id:id})}catch{}});
render();
</script></body></html>
