div><span class="check">✓</span> Манипуляторы</div><div><span class="check">✓</span> Контейнеры</div><div><span class="check">✓</span> Погрузка на объекте</div></div><a class="btn" href="/pickup">Заказать вывоз →</a></div></div></div></div></section><section class="section"><div class="container"><div class="head"><div><div class="eyebrow">Как мы работаем</div><h2>От заявки до расчета</h2></div></div><div class="steps"><div class="step"><b>01</b><h3>Заявка</h3><p>Оставляете телефон или звоните менеджеру.</p></div><div class="step"><b>02</b><h3>Оценка</h3><p>Определяем вид и объем металла, согласуем цену.</p></div><div class="step"><b>03</b><h3>Вывоз</h3><p>Приезжаем своим транспортом и организуем погрузку.</p></div><div class="step"><b>04</b><h3>Расчет</h3><p>Взвешиваем металл и производим расчет.</p></div></div></div></section>${CTA()}</main>`}
function Generic({data}){let [path,title,desc]=data;let kind=path==='/about'||path==='/fleet'||path==='/contacts'||path==='/faq'||path==='/reviews';return `<main><section class="page-hero"><div class="container"><div class="eyebrow">ДемонтажМеталлИнвест</div><h1>${title}</h1><p>${desc}</p></div></section>${kind?InfoPage(path,title):ServicePage(path,title,desc)}${CTA()}</main>`}
function ServicePage(path,title,desc){let special=path==='/prices'||path==='/services';if(path==='/prices')return `<section class="section"><div class="container"><div class="price-layout"><div><div class="eyebrow">Прайс-лист</div><h2>Актуальные цены</h2><table class="table"><thead><tr><th>Металл</th><th>Цена</th><th>Условия приема</th></tr></thead><tbody>${prices.concat([['Кабель (алюминий)','180 ₽']]).map(x=>`<tr><td>${x[0]}</td><td class="price">${x[1]}</td><td>Чистый, без примесей</td></tr>`).join('')}</tbody></table></div><div class="card"><div class="icon">₽</div><h3>Цена зависит от категории</h3><p>Итоговая стоимость зависит от вида металла, засора, объема и условий вывоза. Менеджер подтверждает цену перед приездом.</p><a class="btn" href="/contacts#form" style="display:inline-block;margin-top:22px">Получить цену сегодня</a></div></div></div></section>`;if(path==='/services')return `<section class="section"><div class="container"><div class="cards">${pages.map(x=>`<a class="card" href="${x[0]}"><div class="icon">→</div><h3>${x[1]}</h3><p>${x[2]}</p></a>`).join('')}</div></div></section>`;return `<section class="section"><div class="container"><div class="service-layout"><div class="service-image" style="background-image:url('${path==='/pickup'?img.truck:path.includes('structure')||path==='/buildings'?img.demo:img.steel}')"></div><div><div class="eyebrow">Услуга</div><h2 style="font-size:38px;margin:10px 0 16px">${title}</h2><p style="color:var(--muted);line-height:1.65">${desc} Организуем работы под ключ, согласуем стоимость заранее и обеспечим вывоз собственным транспортом.</p><div class="list"><div><span class="check">✓</span> Оценка объема и категории</div><div><span class="check">✓</span> Погрузка и сортировка</div><div><span class="check">✓</span> Собственный транспорт</div><div><span class="check">✓</span> Быстрый расчет</div></div><a class="btn" href="/contacts#form">Заказать выезд →</a></div></div></div></section>`}
function InfoPage(path,title){if(path==='/about')return `<section class="section"><div class="container"><div class="service-layout"><div class="card"><div class="eyebrow">О компании</div><h2>Работаем с металлом профессионально</h2><p>ДемонтажМеталлИнвест объединяет прием, переработку, самовывоз и демонтаж. Работаем с физическими и юридическими лицами в Санкт-Петербурге и Ленинградской области.</p><div class="stats" style="margin-top:24px"><div class="stat"><strong>5+</strong><span>лет на рынке</span></div><div class="stat"><strong>1000+</strong><span>клиентов</span></div><div class="stat"><strong>50+</strong><span>единиц техники</span></div><div class="stat"><strong>24/7</strong><span>прием заявок</span></div></div></div><div class="service-image"></div></div></div></section>`;if(path==='/fleet')return `<section class="section"><div class="container"><div class="fleet">${[['Ломовозы',img.truck],['Манипуляторы',img.demo],['Экскаваторы',img.steel],['Газели',img.truck],['Контейнеры',img.demo],['Погрузчики',img.steel]].map(x=>`<div class="card"><div class="photo" style="background-image:url('${x[1]}')"></div><h3 style="margin-top:16px">${x[0]}</h3><p>Собственная техника для погрузки, демонтажа и оперативного вывоза.</p></div>`).join('')}</div></div></section>`;if(path==='/contacts')return `<section class="section" id="form"><div class="container"><div class="service-layout"><div><h2>Наши контакты</h2><div class="card" style="margin-top:18px"><h3>+7 (900) 123-45-67</h3><p>Санкт-Петербург и Ленинградская область<br>Работаем ежедневно с 8:00 до 20:00<br>WhatsApp • Telegram</p></div><div class="map" style="margin-top:18px"></div></div><div class="card"><h2>Оставьте заявку</h2><p>Получите индивидуальные условия и предварительную оценку.</p><form class="form" style="grid-template-columns:1fr" onsubmit="event.preventDefault();alert('Заявка принята. Менеджер свяжется с вами.');"><input class="input" placeholder="Ваше имя" required><input class="input" placeholder="Телефон" required><textarea class="input" rows="5" placeholder="Что нужно принять или демонтировать?"></textarea><button class="btn">Отправить заявку →</button></form></div></div></div></section>`;if(path==='/faq'){let q=['Как заказать самовывоз?','Какие металлы принимаете?','Как происходит взвешивание?','Как проходит расчет?','Нужны ли документы?','Делаете ли демонтаж?','Какой минимальный объем?','Работаете ли по Ленинградской области?'];return `<section class="section"><div class="container"><div class="faq">${q.map(x=>`<details><summary>${x}</summary><p>Да. Оставьте заявку или позвоните — менеджер уточнит детали, объем и адрес, после чего согласует условия.</p></details>`).join('')}</div></div></section>`}return `<section class="section"><div class="container"><div class="reviews">${[['Алексей Петров','Отличный сервис, быстро приехали и все рассчитали.'],['Ирина Соколова','Вежливые сотрудники, честный вес и понятная цена.'],['Дмитрий Кузнецов','Все четко и оперативно. Спасибо за профессионализм.']].map(x=>`<article class="review"><div class="stars">★★★★★</div><h3>${x[0]}</h3><p>${x[1]}</p><small>Санкт-Петербург</small></article>`).join('')}</div></div></section>`}
function render(){let path=location.pathname.replace(/\/$/,'')||'/';let content=path==='/'?Home():Generic(pages.find(x=>x[0]===path)||pages[0]);document.getElementById('app').innerHTML=Header()+content+Footer();document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{let u=new URL(a.href);if(u.origin===location.origin){e.preventDefault();history.pushState({},'',u.pathname+u.hash);render();window.scrollTo(0,0)}}))}
window.addEventListener('popstate',render);render();
</script>
