<style>

.feed{display:grid;place-items:center;padding:22px;gap:26px}.video{position:relative;width:min(560px,calc(100vw - 330px));height:calc(100vh - 120px);min-height:610px;border-radius:28px;overflow:hidden;background:#101521;border:1px solid #2a3040;box-shadow:0 25px 90px #0009}.video video,.visual{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.visual{background:radial-gradient(circle at 22% 22%,#5d43d6aa,transparent 25%),radial-gradient(circle at 78% 60%,#27e5ff55,transparent 28%),linear-gradient(145deg,#19112d,#081a24 60%,#13091d)}.visual:after{content:"";position:absolute;inset:18%;border-radius:50%;background:linear-gradient(135deg,#af79ff44,#4ff0ff18);filter:blur(36px)}.brandmark{position:absolute;top:35%;left:0;right:0;text-align:center;font-size:35px;font-weight:900;z-index:1}.brandmark span{color:var(--a)}.gradient{position:absolute;inset:0;background:linear-gradient(transparent 35%,#000f);z-index:2}.info{position:absolute;left:22px;right:80px;bottom:22px;z-index:3}.info h2{font-size:19px;margin:8px 0}.info p{color:#b6bbca}.actions{position:absolute;right:14px;bottom:78px;z-index:3;display:grid;gap:10px}.actions button{width:48px;height:48px;border-radius:50%;border:1px solid #fff2;background:#080a10bb;color:#fff;font-size:18px}.actions em{display:block;font-style:normal;font-size:9px;color:#d6d9e2}.hot{background:#5d1836!important;color:#ff86bb!important}
.page{padding:38px;max-width:1180px;margin:auto}.page h1{font-size:42px;margin:0 0 7px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.card{padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:19px}.art{height:165px;border-radius:14px;background:linear-gradient(135deg,#32205b,#123448);display:grid;place-items:center;font-size:24px;font-weight:800;margin-bottom:13px;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:25px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.metric b{display:block;font-size:28px}.metric span{color:#83899f;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.pill{padding:6px 10px;border-radius:999px;background:#151927;border:1px solid #2b3243;color:#b6bed3;font-size:11px}.empty{padding:50px 20px;text-align:center;color:#81889a}.video-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.video-tile{position:relative;aspect-ratio:9/16;border-radius:17px;overflow:hidden;background:#151a28;border:1px solid #283044}.video-tile img,.video-tile video{width:100%;height:100%;object-fit:cover}.video-tile .veil{position:absolute;left:0;right:0;bottom:0;padding:35px 12px 12px;background:linear-gradient(transparent,#000d)}
.overlay{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:40;padding:18px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#0f121b;border:1px solid #303748;border-radius:24px;padding:23px;box-shadow:0 25px 90px #000}.close{float:right;width:34px;height:34px;border-radius:50%;border:0;background:#242b38;color:#fff}.modal input,.modal textarea{width:100%;padding:13px;background:#080a10;border:1px solid #303647;color:#fff;border-radius:12px;margin:7px 0}.modal textarea{min-height:100px;resize:vertical}.full{width:100%;margin-top:10px}.comment{padding:11px 0;border-bottom:1px solid #242a37}.toast{position:fixed;right:18px;bottom:18px;background:#161b27;border:1px solid #343c4f;color:#fff;padding:12px 15px;border-radius:13px;z-index:90}
.translate-panel{margin-top:12px;padding:14px;border:1px solid #2a3040;border-radius:16px;background:#0b0f17}.translate-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.translate-head b{font-size:13px}.translate-select{background:#121824;border:1px solid #30384a;color:#fff;border-radius:10px;padding:8px}.translate-text{margin-top:10px;min-height:42px;color:#dfe4f1;line-height:1.5}.translate-live{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:5px 8px;background:#17251e;color:#8df7ae;border:1px solid #245739;border-radius:999px}.translate-live.off{color:#8991a8;background:#141922;border-color:#293141}
.live-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.6fr);gap:16px;margin-top:24px}.live-player{position:relative;aspect-ratio:16/9;background:#080b12;border:1px solid #2b3344;border-radius:22px;overflow:hidden}.live-player video{width:100%;height:100%;object-fit:cover;background:#000}.live-placeholder{width:100%;height:100%;display:grid;place-items:center;color:#6f7990;font-size:28px;font-weight:900;background:radial-gradient(circle at 50% 35%,#3a286688,transparent 28%),#090d14}.live-chat{height:100%;min-height:420px;display:flex;flex-direction:column}.live-chat-list{flex:1;overflow:auto;max-height:58vh}.live-card{position:relative;min-height:180px;border:1px solid #2a3040;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#151128,#0b1a25);padding:18px;display:flex;flex-direction:column;justify-content:flex-end}.live-badge{display:inline-flex;align-items:center;gap:6px;background:#ff315f;color:#fff;font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;text-transform:uppercase}.live-card h3{margin:8px 0 4px;font-size:20px}.live-card p{margin:0;color:#a0a7ba}.live-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.live-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#0d111a;border:1px solid #2a3040;border-radius:16px;margin-top:12px}.live-controls .live-action{min-height:40px}.live-controls .live-end{margin-left:auto}.live-stat{padding:8px 11px;border-radius:10px;background:#151a26;color:#d7dbe5;font-size:12px}

@media(max-width:900px){.live-layout{grid-template-columns:1fr}.live-grid{grid-template-columns:1fr 1fr}aside{display:none}main{margin:0}.mobile{display:block;position:absolute;left:15px}.search{width:44px;overflow:hidden}.search input{display:none}.page{padding:27px 17px}.cards{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.video-grid{grid-template-columns:1fr 1fr}.feed{padding:0}.video{width:100%;height:calc(100vh - 72px);min-height:0;border:0;border-radius:0}}

.feed{scroll-snap-type:y proximity}.feed .video{scroll-snap-align:start}.video .sound{position:absolute;left:14px;top:14px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid #fff3;background:#080a10bb;color:#fff}.video .more{position:absolute;right:14px;top:14px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid #fff3;background:#080a10bb;color:#fff}.video .progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff22;z-index:6}.video .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c))}.upload-preview{width:100%;aspect-ratio:9/16;max-height:320px;object-fit:contain;background:#05060a;border-radius:14px;margin:8px 0;display:none}.modal .hint{font-size:11px;color:#7e879b}.statline{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.statline span{padding:5px 8px;background:#151a26;border:1px solid #2a3040;border-radius:999px;color:#aab2c5;font-size:10px}.offline{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:120;background:#3a1522;color:#ffb2c8;border:1px solid #6c2c43;border-radius:999px;padding:8px 14px;font-size:12px}</style></head>
<body>
<aside><div class="logo">CLIP<span>TOK</span><small>FUTURE VIDEO NETWORK</small></div><nav id="nav"></nav><button class="create" id="createBtn">＋ Создать видео</button><div class="side-note">◈ AI recommendations<br>◉ Supabase backend<br>⚡ Realtime chat</div></aside>
<main><header><b class="mobile">CLIPTOK</b><div class="search">⌕ <input id="search" placeholder="Поиск видео, авторов и #хэштегов"></div><button class="avatar" id="avatarBtn">?</button></header><div id="root"></div></main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://lhquumfnuyjwzwcaskoi.supabase.co','sb_publishable_gs7j4qJk0xnsS9VYGMMgHg_IH8TXoHo');
const demo=[
{id:'demo1',profiles:{username:'neonwave',display_name:'Neon Wave'},caption:'Город после полуночи ✦',likes_count:128400,comments_count:1900,views_count:1800000,music_name:'Original sound'},
{id:'demo2',profiles:{username:'creatorlab',display_name:'Creator Lab'},caption:'Build something people remember.',likes_count:84200,comments_count:1200,views_count:930000,music_name:'Creator mode'},
{id:'demo3',profiles:{username:'motiondaily',display_name:'Motion Daily'},caption:'Motion is the new language.',likes_count:231000,comments_count:3200,views_count:3200000,music_name:'Future pulse'},
{id:'demo4',profiles:{username:'autofuture',display_name:'Auto Future'},caption:'Machines from another timeline.',likes_count:67200,comments_count:800,views_count:710000,music_name:'Road to 2030'}];
const nav=[['home','✦','Для вас'],['following','◎','Подписки'],['explore','⌕','Обзор'],['live','●','LIVE'],['messages','◌','Сообщения'],['notifications','◍','Уведомления'],['saved','▣','Сохранённые'],['profile','◉','Профиль'],['studio','◇','Creator Studio'],['settings','⚙','Настройки']];
document.querySelector('#nav').innerHTML=nav.map(n=>'<button data-tab="'+n[0]+'" onclick="window.show(\''+n[0]+'\')"><i>'+n[1]+'</i>'+n[2]+'</button>').join('');

let session=null,currentProfile=null,currentTab='home',feedData=[],liked=new Set(),saved=new Set(),following=new Set();
const fmt=n=>n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(m){const x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}
function authRequired(){document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="authModal"><div class="modal"><button class="close" onclick="authModal.remove()">×</button><h2>Войти в ClipTok</h2><p class="muted">Вход открывает лайки, комментарии, подписки, сохранение и загрузку видео.</p><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Пароль"><button class="primary full" onclick="window.signIn()">Войти</button><button class="ghost full" onclick="window.signUp()">Создать аккаунт</button></div></div>')}
window.signIn=async()=>{const {error}=await supabase.auth.signInWithPassword({email:authEmail.value.trim(),password:authPassword.value});if(error)toast(error.message);else{authModal.remove();await initSession();await window.show(currentTab)}};
window.signUp=async()=>{const e=authEmail.value.trim(),p=authPassword.value;if(!e)return toast('Введите email');if(p.length<6)return toast('Пароль: минимум 6 символов');const btn=document.querySelector('#authModal .primary');if(btn)btn.disabled=true;const {data,error}=await supabase.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});if(btn)btn.disabled=false;if(error){console.error(error);toast(error.message);return}if(data.session){authModal.remove();await initSession();toast('Аккаунт создан')}else{toast('Регистрация создана. Проверьте почту и перейдите по ссылке подтверждения.')}};
async function handleAuthRedirect(){const hash=window.location.hash||'';if(hash.includes('error=')){const p=new URLSearchParams(hash.slice(1));toast(decodeURIComponent(p.get('error_description')||'Ошибка подтверждения'));return}if(hash.includes('access_token=')){const x=await supabase.auth.getSession();if(x.data.session){session=x.data.session;await loadProfile();updateAvatar();toast('Email подтверждён — вы вошли в ClipTok');window.history.replaceState({},document.title,location.pathname+location.search)}}}
async function initSession(){const x=await supabase.auth.getSession();session=x.data.session;if(session)await loadProfile();updateAvatar();await handleAuthRedirect()}
async function loadProfile(){const r=await supabase.from('profiles').select('*').eq('id',session.user.id).maybeSingle();currentProfile=r.data||null}
function updateAvatar(){document.querySelector('#avatarBtn').textContent=currentProfile?.display_name?.slice(0,2).toUpperCase()||'?'}
async function loadSets(ids=[]){if(!session)return;const [l,s,f]=await Promise.all([supabase.from('likes').select('video_id').eq('user_id',session.user.id),supabase.from('saved_videos').select('video_id').eq('user_id',session.user.id),supabase.from('follows').select('following_id').eq('follower_id',session.user.id)]);liked=new Set((l.data||[]).map(x=>x.video_id));saved=new Set((s.data||[]).map(x=>x.video_id));following=new Set((f.data||[]).map(x=>x.following_id))}
async function loadFeed(tab){let q=supabase.from('videos').select('*,profiles(id,username,display_name,avatar_url,verified)').eq('status','published').order('created_at',{ascending:false}).limit(30);if(tab==='following'){if(!session)return [];const f=await supabase.from('follows').select('following_id').eq('follower_id',session.user.id);const ids=(f.data||[]).map(x=>x.following_id);if(!ids.length)return [];q=q.in('user_id',ids)}const r=await q;return r.data||[]}
function videoHTML(v){
 const p=v.profiles||{};
 const media=v.video_url ? '<video src="'+esc(v.video_url)+'" playsinline loop autoplay muted controlslist="nodownload"></video>' : '<div class="visual"></div><div class="brandmark">CLIP<span>TOK</span></div>';
 return `<article class="video">${media}<div class="gradient"></div><div class="info"><b>@${esc(p.username||'creator')}${p.verified?' ✓':''}</b><h2>${esc(v.caption||'Без описания')}</h2><p>♬ ${esc(v.music_name||'Original sound')}</p></div><div class="actions"><button class="${liked.has(v.id)?'hot':''}" onclick="window.toggleLike('${v.id}')">♥<em>${fmt(v.likes_count)}</em></button><button onclick="window.openComments('${v.id}')">●<em>${fmt(v.comments_count)}</em></button><button class="${saved.has(v.id)?'hot':''}" onclick="window.toggleSave('${v.id}')">▣<em>Сохранить</em></button><button onclick="window.shareVideo('${v.id}')">↗<em>Share</em></button></div></article>`;
}
async function showTab(tab){
 currentTab=tab;
 document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('active',x.dataset.tab===tab)});
 const root=document.querySelector('#root');
 if(tab==='home'||tab==='following'){
   feedData=await loadFeed(tab);
   if(!feedData.length&&tab==='home') feedData=demo;
   await loadSets();
   root.innerHTML='<div class="feed">'+(feedData.length?feedData.map(videoHTML).join(''):'<div class="empty">Подписок пока нет.</div>')+'</div>';
   return;
 }
 if(tab==='explore'){await renderExplore();return;}
 if(tab==='live'){await renderLive();return;}
 if(tab==='notifications'){await renderNotifications();return;}
 if(tab==='saved'){await renderSaved();return;}
 if(tab==='profile'){await renderProfile(currentProfile?.id);return;}
 if(tab==='studio'){await renderStudio();return;}
 if(tab==='messages'){await renderMessages();return;}
 if(tab==='settings'){await renderSettings();return;}
}
window.show=showTab;
async function renderExplore(){const r=await supabase.from('videos').select('*,profiles(username,display_name)').eq('status','published').order('views_count',{ascending:false}).limit(24);const list=r.data?.length?r.data:demo;document.querySelector('#root').innerHTML='<section class="page"><h1>Explore</h1><p class="muted">Тренды и новые публикации.</p><div class="video-grid">'+list.map(v=>'<div class="video-tile">'+(v.video_url?'<video src="'+esc(v.video_url)+'" muted controls></video>':'<div class="visual"></div><div class="brandmark" style="top:45%">CLIP<span>TOK</span></div>')+'<div class="veil"><b>'+esc(v.caption)+'</b><div class="muted">@'+esc(v.profiles?.username||'creator')+' · '+fmt(v.views_count)+' просмотров</div></div></div>').join('')+'</div></section>'}

let liveChannel=null,liveRoom=null,localStream=null,liveRole=null,peerConnections=new Map(),pendingIce=new Map(),liveUserId=null; Object.defineProperty(window,'liveRoom',{configurable:true,get:()=>liveRoom});

async function renderLive(){
 const r=await supabase.from('live_rooms').select('*,profiles(username,display_name,avatar_url,verified)').eq('status','live').order('created_at',{ascending:false}).limit(30);
 const rooms=r.data||[];
 const cards=rooms.map(x=>`<div class="live-card"><span class="live-badge">● LIVE</span><h3>${esc(x.title)}</h3><p>@${esc(x.profiles?.username||'creator')} · ${esc(x.category||'general')}</p><button class="ghost" style="margin-top:12px" onclick="window.joinLive('${x.id}')">Смотреть эфир</button></div>`).join('');
 document.querySelector('#root').innerHTML=`<section class="page"><div class="row"><div><h1>LIVE</h1><p class="muted">Прямые эфиры ClipTok в реальном времени.</p></div><div class="grow"></div><button class="primary" onclick="window.startLive()">＋ Начать эфир</button></div><div class="live-grid">${cards||'<div class="empty">Сейчас нет активных эфиров. Создай первый.</div>'}</div></section>`;
}
window.startLive=async()=>{
 if(!session)return authRequired();
 document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="liveCreateModal"><div class="modal"><button class="close" onclick="liveCreateModal.remove()">×</button><h2>Начать прямой эфир</h2><input id="liveTitle" placeholder="Название эфира"><textarea id="liveDesc" placeholder="О чём эфир?"></textarea><input id="liveCategory" placeholder="Категория, например gaming / music / talk"><button class="primary full" onclick="window.createLiveRoom()">Начать эфир</button></div></div>');
};

window.createLiveRoom=async()=>{
 const title=liveTitle.value.trim();if(!title)return toast('Введите название эфира');
 const r=await supabase.from('live_rooms').insert({host_id:session.user.id,title,description:liveDesc.value.trim(),category:liveCategory.value.trim()||'general',status:'live'}).select().single();
 if(r.error)return toast(r.error.message);
 liveCreateModal.remove(); await openLiveRoom(r.data.id,true);
};

async function openLiveRoom(roomId,isHost=false){
 const r=await supabase.from('live_rooms').select('*,profiles(username,display_name,avatar_url,verified)').eq('id',roomId).single();
 if(r.error)return toast(r.error.message);
 if(r.data.status!=='live'&&!isHost)return toast('Эфир уже завершён');
 liveRoom=r.data;
 liveRole=isHost?'host':'viewer';
 liveUserId=session?.user?.id||('guest-'+crypto.randomUUID());
 const chat=await supabase.from('live_chat_messages').select('*,profiles(username,display_name)').eq('room_id',roomId).order('created_at',{ascending:true}).limit(100);
 const messages=(chat.data||[]).map(function(m){return '<div class="comment"><b>@'+esc(m.profiles?.username||'user')+'</b><div>'+esc(m.body)+'</div></div>'}).join('');
 const media=isHost
   ? '<video id="localLiveVideo" autoplay playsinline muted></video>'
   : '<div class="live-placeholder" id="livePlaceholder">ПОДКЛЮЧЕНИЕ…</div><video id="remoteLiveVideo" autoplay playsinline controls style="display:none"></video><button class="ghost" style="position:absolute;bottom:12px;right:12px;z-index:4" onclick="document.querySelector(\'#remoteLiveVideo\')?.play()">🔊 Включить звук</button>';
 const controls='<button class="ghost live-action" onclick="window.toggleLiveMic()" id="liveMicBtn">🎤 Микрофон</button><button class="ghost live-action" onclick="window.toggleLiveCamera()" id="liveCamBtn">📷 Камера</button><button class="ghost live-action" onclick="window.switchLiveCamera()" id="liveSwitchBtn">🔄 Камера</button>'+(isHost ? '<button class="danger live-action live-end" onclick="window.endLive()">🔴 Завершить эфир</button>' : '<button class="danger live-action" onclick="window.leaveLive()">🚪 Выйти из эфира</button>');

async function connectLive(roomId,isHost){
 if(liveChannel)try{await supabase.removeChannel(liveChannel)}catch{}
 // Для ведущего сначала получаем медиапоток, затем допускаем зрителей.
 // Иначе offer может уйти до появления audio/video tracks.
 if(isHost){
   try{
     localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
     const v=document.querySelector('#localLiveVideo');
     if(v){v.srcObject=localStream;v.muted=true;await v.play().catch(()=>{});}
   }catch(e){
     console.error(e);
     toast(e.name==='NotAllowedError'?'Разрешите камеру и микрофон в браузере':('Камера/микрофон: '+(e.message||e.name)));
     return;
   }
 }
 liveChannel=supabase.channel('live:'+roomId);
 liveChannel
   .on('presence',{event:'sync'},()=>{
     const state=liveChannel.presenceState();
     const count=Object.values(state).reduce((n,a)=>n+a.length,0);
     const el=document.querySelector('#viewerCount');
     if(el)el.textContent='● '+count+' зрителей';
   })
   .on('broadcast',{event:'signal'},async(payload)=>{
     const d=payload.payload||{};
     if(d.target&&d.target!==liveUserId)return;
     try{
       if(d.kind==='viewer-join'&&isHost)await handleViewerJoin(d.from);
       if(d.kind==='offer'&&!isHost)await handleOffer(d);
       if(d.kind==='answer'&&isHost)await handleAnswer(d);
       if(d.kind==='ice')await handleIce(d);
       if(d.kind==='chat')appendLiveChat(d);
       if(d.kind==='translation'&&!isHost)await handleTranslationMessage(d);
     }catch(e){console.error('LIVE signal',e)}
   });
 await liveChannel.subscribe(async status=>{
   if(status!=='SUBSCRIBED'){console.warn('LIVE realtime status',status);return}
   await liveChannel.track({user_id:liveUserId,role:isHost?'host':'viewer'});
   if(!isHost){
     await liveChannel.send({type:'broadcast',event:'signal',payload:{kind:'viewer-join',from:liveUserId,target:liveRoom.host_id}});
   }
 });
}
async function makePeer(id,initiator){
 const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
 peerConnections.set(id,pc);pendingIce.set(id,[]);
 if(liveRole==='host'&&localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.onicecandidate=e=>{if(e.candidate)liveChannel.send({type:'broadcast',event:'signal',payload:{kind:'ice',from:liveUserId,target:id,candidate:e.candidate}})};
 if(liveRole==='viewer')pc.ontrack=async e=>{const v=document.querySelector('#remoteLiveVideo');const p=document.querySelector('#livePlaceholder');if(v){v.srcObject=e.streams[0];v.muted=false;v.volume=1;v.style.display='block';try{await v.play()}catch{toast('Нажмите «Включить звук» для прослушивания эфира')}}if(p)p.style.display='none'};
 if(initiator){const offer=await pc.createOffer();await pc.setLocalDescription(offer);await liveChannel.send({type:'broadcast',event:'signal',payload:{kind:'offer',from:liveUserId,target:id,sdp:offer}})}
 return pc;
}
async function handleViewerJoin(viewerId){if(peerConnections.has(viewerId))return;await makePeer(viewerId,true)}
async function handleOffer(d){const pc=peerConnections.get(d.from)||await makePeer(d.from,false);await pc.setRemoteDescription(d.sdp);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await liveChannel.send({type:'broadcast',event:'signal',payload:{kind:'answer',from:liveUserId,target:d.from,sdp:answer}});for(const c of (pendingIce.get(d.from)||[])){try{await pc.addIceCandidate(c)}catch{}}pendingIce.set(d.from,[])}
async function handleAnswer(d){const pc=peerConnections.get(d.from);if(!pc)return;await pc.setRemoteDescription(d.sdp);for(const c of (pendingIce.get(d.from)||[])){try{await pc.addIceCandidate(c)}catch{}}pendingIce.set(d.from,[])}
async function handleIce(d){const pc=peerConnections.get(d.from);if(!pc||(pc.remoteDescription&&pc.remoteDescription.type)){try{if(pc)await pc.addIceCandidate(d.candidate)}catch{}}else{(pendingIce.get(d.from)||[]).push(d.candidate)}}

 ['pt','Português'],['pl','Polski'],['nl','Nederlands'],['fi','Suomi'],['sv','Svenska'],['da','Dansk'],

function translationPanel(isHost){

const SPEECH_LANG={ru:'ru-RU',en:'en-US',de:'de-DE',fr:'fr-FR',es:'es-ES',it:'it-IT',pt:'pt-PT',pl:'pl-PL',nl:'nl-NL',fi:'fi-FI',sv:'sv-SE',da:'da-DK',no:'nb-NO',cs:'cs-CZ',uk:'uk-UA',tr:'tr-TR',ar:'ar-SA',he:'he-IL',hi:'hi-IN',id:'id-ID',ja:'ja-JP',ko:'ko-KR',zh:'zh-CN',th:'th-TH',vi:'vi-VN',ro:'ro-RO',hu:'hu-HU',el:'el-GR',bg:'bg-BG',sk:'sk-SK',sl:'sl-SI',hr:'hr-HR',lt:'lt-LT',ta:'ta-IN',te:'te-IN',mr:'mr-IN',kn:'kn-IN'};
const speechLocale=lang=>SPEECH_LANG[lang]||lang;
async function translateText(text,source,target){
 if(!text.trim())return '';
 if(source===target)return text;
 if(!('Translator' in self))return '';
 try{
   const availability=await Translator.availability({sourceLanguage:source,targetLanguage:target});
   if(availability==='unavailable')return '';
   const tr=await Translator.create({sourceLanguage:source,targetLanguage:target});
   return await tr.translate(text);
 }catch(e){console.warn('Translator API',e);return ''}
}

function speakTranslated(text,lang){
 if(!translationEnabled||!text||!('speechSynthesis' in window))return;
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=1.02;u.pitch=1;
 window.speechSynthesis.speak(u);
}

async function startSpeechRecognition(){
 if(speechRunning)return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast('Распознавание речи недоступно в этом браузере');return}
 speechRecognition=new SR();
 speechRecognition.lang=speechLocale(translationSource);
 speechRecognition.continuous=true;
 speechRecognition.interimResults=true;
 speechRecognition.maxAlternatives=1;
 speechRecognition.onresult=async e=>{
   let finalText='';
   for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+' ';}
   finalText=finalText.trim();
   if(!finalText||!liveChannel||!liveRoom)return;
   const msg={kind:'translation',from:liveUserId,text:finalText,source:translationSource};
   await liveChannel.send({type:'broadcast',event:'signal',payload:msg});
   const local=await translateText(finalText,translationSource,translationTarget);
   if(local){showTranslation(local);if(liveRole!=='host')speakTranslated(local,translationTarget)}
 };
 speechRecognition.onstart=()=>{speechRunning=true;const s=document.querySelector('#translateStatus');if(s)s.textContent='● Речь распознаётся'};
 speechRecognition.onend=()=>{speechRunning=false;if(liveRole==='host')setTimeout(()=>{try{speechRecognition.start()}catch{}},250)};
 speechRecognition.onerror=e=>{console.warn('speech',e.error);speechRunning=false;if(e.error==='not-allowed')toast('Разреши доступ к микрофону для перевода')};
 try{speechRecognition.start()}catch(e){toast('Не удалось запустить распознавание речи')}
}
function stopSpeechRecognition(){speechRunning=false;if(speechRecognition){try{speechRecognition.onend=null;speechRecognition.stop()}catch{}speechRecognition=null}}
async function handleTranslationMessage(d){
 if(d.source)translationSource=d.source;
 const out=await translateText(d.text,translationSource,translationTarget);
 if(out){showTranslation(out);speakTranslated(out,translationTarget)}
}
function showTranslation(text){const el=document.querySelector('#translateText');if(el)el.textContent=text}
window.toggleTranslation=async()=>{
 translationEnabled=!translationEnabled;
 if(liveRole==='host'){
   if(translationEnabled)await startSpeechRecognition();else stopSpeechRecognition();
 }else if(!translationEnabled&&'speechSynthesis' in window)window.speechSynthesis.cancel();
 const s=document.querySelector('#translateStatus');if(s)s.textContent=translationEnabled?'● Перевод включён':'● Перевод выключен';
};

let feedObserver=null,activeVideo=null,offlineBanner=null;
const safeUrl=u=>{try{const x=new URL(u,location.href);return ['http:','https:','blob:'].includes(x.protocol)?x.href:''}catch{return ''}};
function refreshFeedUX(){if(feedObserver)feedObserver.disconnect();const vids=[...document.querySelectorAll('.feed video')];feedObserver=new IntersectionObserver(es=>es.forEach(({target,isIntersecting,intersectionRatio})=>{if(isIntersecting&&intersectionRatio>.65){vids.forEach(v=>{if(v!==target)v.pause()});target.muted=true;target.play().then(()=>activeVideo=target).catch(()=>{})}else if(intersectionRatio<.2)target.pause()}),{threshold:[.2,.65,.9]});vids.forEach(v=>{v.muted=true;v.setAttribute('playsinline','');v.addEventListener('timeupdate',()=>{const p=v.closest('.video')?.querySelector('.progress i');if(p&&v.duration)p.style.width=(v.currentTime/v.duration*100)+'%'});v.addEventListener('dblclick',()=>{const id=v.closest('.video')?.dataset.id;if(id&&!liked.has(id))window.toggleLike(id)});feedObserver.observe(v)})}
window.toggleVideoSound=async b=>{const v=b.closest('.video')?.querySelector('video');if(!v)return;v.muted=!v.muted;b.textContent=v.muted?'🔇':'🔊';if(!v.muted)try{await v.play()}catch{}};

videoHTML=function(v){const p=v.profiles||{};const media=v.video_url?'<video src="'+esc(safeUrl(v.video_url))+'" playsinline loop muted preload="metadata"></video>':'<div class="visual"></div><div class="brandmark">CLIP<span>TOK</span></div>';return '<article class="video" data-id="'+esc(v.id)+'">'+media+'<button class="sound" onclick="window.toggleVideoSound(this)">🔇</button><button class="more" onclick="window.openVideoMenu(\''+esc(v.id)+'\')">⋯</button><div class="progress"><i></i></div><div class="gradient"></div><div class="info"><b>@'+esc(p.username||'creator')+(p.verified?' ✓':'')+'</b><h2>'+esc(v.caption||'Без описания')+'</h2><p>♬ '+esc(v.music_name||'Original sound')+'</p><div class="statline"><span>'+fmt(v.views_count)+' просмотров</span></div></div><div class="actions"><button class="'+(liked.has(v.id)?'hot':'')+'" onclick="window.toggleLike(\''+esc(v.id)+'\')">♥<em>'+fmt(v.likes_count)+'</em></button><button onclick="window.openComments(\''+esc(v.id)+'\')">●<em>'+fmt(v.comments_count)+'</em></button><button class="'+(saved.has(v.id)?'hot':'')+'" onclick="window.toggleSave(\''+esc(v.id)+'\')">▣<em>Сохранить</em></button><button onclick="window.shareVideo(\''+esc(v.id)+'\')">↗<em>Share</em></button></div></article>'};

window.uploadVideo=async()=>{const file=document.querySelector('#videoFile')?.files?.[0];if(!file)return toast('Выберите видео');if(file.size>500*1024*1024)return toast('Максимальный размер — 500 MB');const caption=document.querySelector('#videoCaption')?.value.trim()||'',music=document.querySelector('#musicName')?.value.trim()||'',btn=document.querySelector('#uploadModal .primary:last-child');if(btn){btn.disabled=true;btn.textContent='Загрузка…'}const path=session.user.id+'/'+Date.now()+'-'+file.name.replace(/[^\w.\-а-яА-Я]/g,'_');const u=await supabase.storage.from('videos').upload(path,file,{contentType:file.type||'video/mp4',upsert:false});if(u.error){if(btn)btn.disabled=false;return toast(u.error.message)}const url=supabase.storage.from('videos').getPublicUrl(path).data.publicUrl;const r=await supabase.from('videos').insert({user_id:session.user.id,video_url:url,caption,music_name:music,status:'published'});if(r.error){await supabase.storage.from('videos').remove([path]);if(btn)btn.disabled=false;return toast(r.error.message)}uploadModal.remove();toast('Видео опубликовано');await window.show('home')};

let feedPage=0,feedLoading=false;
async function loadMoreForYou(reset=false){
 if(feedLoading)return; feedLoading=true;
 try{
  const {data,error}=await supabase.rpc('get_for_you',{p_user_id:session?.user?.id||null,p_limit:20,p_offset:reset?0:feedPage*20});
  if(error) throw error;
  if(reset)feedPage=0; else feedPage++;
  const root=document.querySelector('.feed');
  if(root&&data?.length){ if(reset)root.innerHTML=''; data.forEach(v=>root.insertAdjacentHTML('beforeend',videoHTML({...v,profiles:{username:'creator'}}))); refreshFeedUX(); }
 }catch(e){console.warn('feed',e)}
 finally{feedLoading=false}
}
window.trackVideoView=async(videoId,watchSeconds=0,completed=false)=>{

};
