<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipTok — Future Video Network</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05060a;color:#fff;font:14px Inter,Arial,sans-serif}button,input{font:inherit}
.app{min-height:100vh;background:radial-gradient(circle at 70% 0,#43256b55,transparent 30%),#05060a}
aside{position:fixed;inset:0 auto 0 0;width:245px;padding:28px 17px;border-right:1px solid #20212c;background:#08090eec;backdrop-filter:blur(20px);z-index:5}
.logo{font-size:25px;font-weight:900;margin:0 10px 40px}.logo span{background:linear-gradient(90deg,#63edff,#9064ff,#ff59bd);-webkit-background-clip:text;color:transparent}.logo small{display:block;color:#686b7b;font-size:8px;letter-spacing:2px;margin-top:5px}
nav{display:grid;gap:5px}nav button{border:0;background:transparent;color:#9699aa;text-align:left;padding:13px;border-radius:13px;cursor:pointer}nav button.active,nav button:hover{background:#191a24;color:white}nav i{display:inline-block;width:32px;font-style:normal;font-size:18px}
.create,.primary{border:0;color:#fff;background:linear-gradient(110deg,#665bff,#bd4fff);border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer}.create{width:100%;margin:20px 0}.bottom{position:absolute;bottom:25px;color:#696c7a;line-height:2;font-size:12px}
main{margin-left:245px;min-height:100vh}header{height:75px;position:sticky;top:0;z-index:4;display:flex;justify-content:center;align-items:center;background:#05060add;backdrop-filter:blur(20px);border-bottom:1px solid #181923}.search{width:470px;background:#11121a;border:1px solid #292b38;border-radius:16px;padding:11px 15px;color:#777}.search input{width:90%;background:none;border:0;outline:0;color:#fff;margin-left:8px}.avatar{position:absolute;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid #383946;background:#191a23;color:#fff}
.feed{display:grid;place-items:center;padding:25px;gap:30px}.video{position:relative;width:min(530px,calc(100vw - 315px));height:calc(100vh - 125px);min-height:620px;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 35% 20%,#432a71,#11172a 45%,#08090d);border:1px solid #2a2c3a;box-shadow:0 30px 90px #0009}.visual{position:absolute;inset:0;background:radial-gradient(circle at 25% 25%,#6d49d8aa,transparent 25%),radial-gradient(circle at 75% 55%,#21dff655,transparent 30%),linear-gradient(150deg,#17132a,#08151e 60%,#120a1e)}.visual:after{content:"";position:absolute;inset:20%;border-radius:50%;background:linear-gradient(135deg,#a96cff55,#50eaff22);filter:blur(35px)}.video .brandmark{position:absolute;top:35%;left:0;right:0;text-align:center;font-size:35px;font-weight:900;z-index:1}.brandmark span{color:#65ecff}.gradient{position:absolute;inset:0;background:linear-gradient(transparent 35%,#000d);z-index:2}.info{position:absolute;left:24px;right:80px;bottom:24px;z-index:3}.info h2{font-size:19px;margin:10px 0}.info small{color:#bfc1cc;margin-left:8px}.info p{color:#b9bbc8}.actions{position:absolute;right:14px;bottom:90px;z-index:3;display:grid;gap:12px}.actions button{width:48px;height:48px;border-radius:50%;border:1px solid #fff2;background:#090a12bb;color:#fff;cursor:pointer;font-size:19px}.actions em{display:block;font-style:normal;font-size:9px}
.page{padding:45px;max-width:1150px;margin:auto}.page h1{font-size:42px;margin:0 0 8px}.muted{color:#8d90a0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}.card{padding:18px;background:#11121a;border:1px solid #292b38;border-radius:20px}.art{height:150px;border-radius:14px;background:linear-gradient(135deg,#32235b,#172f43);display:grid;place-items:center;font-size:24px;font-weight:800;margin-bottom:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0}.metric{background:#11121a;border:1px solid #292b38;border-radius:18px;padding:22px}.metric b{display:block;font-size:27px}.metric span{color:#858897;font-size:12px}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20;padding:20px}.modal{width:min(520px,100%);background:#11121a;border:1px solid #2c2e3b;border-radius:25px;padding:25px}.close{float:right;background:#242530;border:0;color:#fff;border-radius:50%;width:35px;height:35px}.modal input{width:100%;padding:13px;background:#08090e;border:1px solid #30323e;color:#fff;border-radius:12px;margin:9px 0}.full{width:100%;margin-top:10px}.comment{padding:12px 0;border-bottom:1px solid #292b35}.mobile{display:none}
@media(max-width:800px){aside{display:none}main{margin:0}header{height:65px}.mobile{display:block;position:absolute;left:15px;font-weight:900}.search{width:42px;overflow:hidden}.search input{display:none}.feed{padding:0}.video{width:100%;height:calc(100vh - 65px);min-height:0;border:0;border-radius:0}.page{padding:28px 17px}.cards,.metrics{grid-template-columns:1fr 1fr}.page h1{font-size:32px}}
</style></head><body>
<div class="app"><aside><div class="logo">CLIP<span>TOK</span><small>FUTURE VIDEO NETWORK</small></div><nav id="nav"></nav><button class="create" onclick="openUpload()">＋ Создать</button><div class="bottom">◈ AI recommendations<br>⚙ Settings<br>◉ Help center</div></aside>
<main><header><b class="mobile">CLIPTOK</b><div class="search">⌕ <input id="search" placeholder="Поиск видео, авторов и #хэштегов"></div><button class="avatar" onclick="show('profile')">PF</button></header><div id="root"></div></main></div>
<script>
const vids=[
["Neon Wave","@neonwave","The city after midnight ✦","1.8M","128.4K","#future"],
["Creator Lab","@creatorlab","Build something people remember.","930K","84.2K","#creator"],
["Motion Daily","@motiondaily","Motion is the new language.","3.2M","231K","#motion"],
["Auto Future","@autofuture","Machines from another timeline.","710K","67.2K","#cars"],
["Foodverse","@foodverse","One bite. Infinite possibilities.","1.1M","95.3K","#food"],
["Travel X","@travelx","Earth still has surprises.","2.4M","186K","#travel"]];
let liked=new Set();
const nav=[["home","✦","Для вас"],["following","◎","Подписки"],["explore","⌕","Обзор"],["messages","◌","Сообщения"],["profile","◉","Профиль"],["studio","◇","Creator Studio"],["admin","▦","Админ"]];
nav.forEach(n=>document.getElementById("nav").innerHTML+=`<button data-tab="${n[0]}" onclick="show('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`);
function show(tab){
document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
let r=document.getElementById("root");
if(tab==="home"){r.innerHTML='<div class="feed">'+vids.map((v,i)=>video(v,i)).join("")+'</div>';return}
if(tab==="explore"){r.innerHTML=`<section class="page"><h1>Explore</h1><p class="muted">Тренды и темы будущего.</p><div class="cards">${vids.map(v=>card(v)).join("")}</div></section>`;return}
if(tab==="following"){r.innerHTML=`<section class="page"><h1>Подписки</h1><p class="muted">Новые видео от авторов, которых ты читаешь.</p><div class="cards">${vids.slice(0,3).map(v=>card(v)).join("")}</div></section>`;return}
if(tab==="profile"){r.innerHTML=`<section class="page"><h1>Pavel</h1><p class="muted">@pavel · creator</p><button class="primary">Редактировать профиль</button><div class="metrics"><div class="metric"><b>12.4K</b><span>Подписчики</span></div><div class="metric"><b>318</b><span>Подписки</span></div><div class="metric"><b>24</b><span>Видео</span></div><div class="metric"><b>4.8M</b><span>Просмотры</span></div></div><div class="cards">${vids.map(v=>card(v)).join("")}</div></section>`;return}
if(tab==="studio"){r.innerHTML=`<section class="page"><h1>Creator Studio</h1><p class="muted">Управление контентом и аналитика.</p><div class="metrics">${[['8.4M','Просмотры'],['412K','Лайки'],['126K','Новые подписчики'],['€4,820','Доход']].map(x=>`<div class="metric"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div><div class="card"><h2>AI Insights</h2><p class="muted">Лучшее окно публикации: 19:00–22:00. Твои ролики с #future получают больше просмотров в демо-данных.</p></div></section>`;return}
if(tab==="admin"){r.innerHTML=`<section class="page"><h1>Admin Dashboard</h1><div class="metrics">${[['24,891','Users'],['24','Videos'],['98.7%','Uptime'],['312','Reports']].map(x=>`<div class="metric"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div><div class="card"><h2>Content moderation</h2>${vids.map(v=>`<p class="comment">${v[1]} — ${v[2]} <button>Review</button></p>`).join("")}</div></section>`;return}
r.innerHTML=`<section class="page"><h1>${tab==="messages"?"Messages":"Following"}</h1><p class="muted">Раздел готов.</p><div class="cards"><div class="card"><b>Alex</b><p>🔥 Видел новый ролик?</p></div><div class="card"><b>Maria</b><p>Отправила тебе подборку.</p></div></div></section>`;
}
function video(v,i){return `<article class="video"><div class="visual"></div><div class="brandmark">CLIP<span>TOK</span></div><div class="gradient"></div><div class="info"><b>${v[0]} <small>${v[1]}</small></b><h2>${v[2]}</h2><p>${v[5]} · ♬ Original sound</p></div><div class="actions"><button onclick="like(${i},this)">♥<em>${liked.has(i)?"+1 ":""}${v[4]}</em></button><button onclick="comments('${v[0]}')">●<em>${Math.round(500+i*410)}</em></button><button onclick="share()">↗<em>Share</em></button><button>•••</button></div></article>`}
function card(v){return `<div class="card"><div class="art">${v[5]}</div><b>${v[2]}</b><p class="muted">${v[1]} · ${v[3]} views</p></div>`}
function like(i,b){liked.has(i)?liked.delete(i):liked.add(i);b.classList.toggle("hot");b.querySelector("em").textContent=(liked.has(i)?"+1 ":"")+vids[i][4]}
function comments(n){document.body.insertAdjacentHTML("beforeend",`<div class="overlay" id="ov"><div class="modal"><button class="close" onclick="ov.remove()">×</button><h2>Комментарии</h2><p class="comment">@alex · Это будущее 🔥</p><p class="comment">@maria · Очень круто</p><input placeholder="Добавить комментарий"><button class="primary full" onclick="ov.remove()">Отправить</button></div></div>`)}
function openUpload(){document.body.insertAdjacentHTML("beforeend",`<div class="overlay" id="up"><div class="modal"><button class="close" onclick="up.remove()">×</button><h2>Создать видео</h2><div class="card" style="text-align:center;margin:20px 0">Перетащи видео сюда<br><small>MP4 / WebM · до 500 MB</small></div><input placeholder="Описание"><input placeholder="#хэштеги"><button class="primary full" onclick="up.remove();alert('Демо: видео добавлено в очередь публикации')">Опубликовать</button></div></div>`)}
function share(){navigator.clipboard?.writeText(location.href);alert("Ссылка скопирована")}
show("home");
</script></body></html>
