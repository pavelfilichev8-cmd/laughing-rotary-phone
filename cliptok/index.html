<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipTok — Future Video Network</title>
<style>
:root{--bg:#05060a;--panel:#0d1018;--panel2:#151a26;--line:#283043;--muted:#8991a8;--a:#5cecff;--b:#8a62ff;--c:#ff5db9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#45287355,transparent 30%),#05060a;color:#fff;font:14px Inter,system-ui,Arial}button,input,textarea{font:inherit}button{cursor:pointer}
aside{position:fixed;inset:0 auto 0 0;width:250px;padding:24px 16px;border-right:1px solid #1c2130;background:#080a10ee;backdrop-filter:blur(18px);z-index:20}
.logo{font-size:25px;font-weight:900;margin:4px 8px 34px}.logo span{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;color:transparent}.logo small{display:block;color:#667087;font-size:8px;letter-spacing:2px;margin-top:4px}
nav{display:grid;gap:5px}nav button{border:1px solid transparent;background:transparent;color:#9299ad;text-align:left;padding:12px;border-radius:13px}nav button:hover,nav button.active{background:#181d28;color:#fff;border-color:#293244}nav i{display:inline-block;width:30px;font-style:normal;font-size:18px}.create,.primary{border:0;color:#fff;background:linear-gradient(110deg,#635cff,#bb4fff);border-radius:14px;padding:13px 16px;font-weight:800}.create{width:100%;margin:18px 0}.ghost{background:#141925;color:#fff;border:1px solid #2a3243;border-radius:12px;padding:10px 13px}.danger{background:#28151f;color:#ff9dbe;border:1px solid #5a2740;border-radius:12px;padding:10px 13px}.side-note{position:absolute;bottom:20px;color:#69738a;font-size:11px;line-height:1.9}
main{margin-left:250px;min-height:100vh}header{height:72px;position:sticky;top:0;z-index:15;display:flex;justify-content:center;align-items:center;background:#05060add;backdrop-filter:blur(18px);border-bottom:1px solid #1a1f2b}.search{width:500px;background:#111521;border:1px solid #2a3040;border-radius:16px;padding:11px 15px;color:#777}.search input{width:92%;background:none;border:0;outline:0;color:#fff;margin-left:8px}.avatar{position:absolute;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid #3b4355;background:#181e2a;color:#fff;font-weight:800}.mobile{display:none}
.feed{display:grid;place-items:center;padding:22px;gap:26px}.video{position:relative;width:min(560px,calc(100vw - 330px));height:calc(100vh - 120px);min-height:610px;border-radius:28px;overflow:hidden;background:#101521;border:1px solid #2a3040;box-shadow:0 25px 90px #0009}.video video,.visual{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.visual{background:radial-gradient(circle at 22% 22%,#5d43d6aa,transparent 25%),radial-gradient(circle at 78% 60%,#27e5ff55,transparent 28%),linear-gradient(145deg,#19112d,#081a24 60%,#13091d)}.visual:after{content:"";position:absolute;inset:18%;border-radius:50%;background:linear-gradient(135deg,#af79ff44,#4ff0ff18);filter:blur(36px)}.brandmark{position:absolute;top:35%;left:0;right:0;text-align:center;font-size:35px;font-weight:900;z-index:1}.brandmark span{color:var(--a)}.gradient{position:absolute;inset:0;background:linear-gradient(transparent 35%,#000f);z-index:2}.info{position:absolute;left:22px;right:80px;bottom:22px;z-index:3}.info h2{font-size:19px;margin:8px 0}.info p{color:#b6bbca}.actions{position:absolute;right:14px;bottom:78px;z-index:3;display:grid;gap:10px}.actions button{width:48px;height:48px;border-radius:50%;border:1px solid #fff2;background:#080a10bb;color:#fff;font-size:18px}.actions em{display:block;font-style:normal;font-size:9px;color:#d6d9e2}.hot{background:#5d1836!important;color:#ff86bb!important}
.page{padding:38px;max-width:1180px;margin:auto}.page h1{font-size:42px;margin:0 0 7px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.card{padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:19px}.art{height:165px;border-radius:14px;background:linear-gradient(135deg,#32205b,#123448);display:grid;place-items:center;font-size:24px;font-weight:800;margin-bottom:13px;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:25px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.metric b{display:block;font-size:28px}.metric span{color:#83899f;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.pill{padding:6px 10px;border-radius:999px;background:#151927;border:1px solid #2b3243;color:#b6bed3;font-size:11px}.empty{padding:50px 20px;text-align:center;color:#81889a}.video-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.video-tile{position:relative;aspect-ratio:9/16;border-radius:17px;overflow:hidden;background:#151a28;border:1px solid #283044}.video-tile img,.video-tile video{width:100%;height:100%;object-fit:cover}.video-tile .veil{position:absolute;left:0;right:0;bottom:0;padding:35px 12px 12px;background:linear-gradient(transparent,#000d)}
.overlay{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:40;padding:18px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#0f121b;border:1px solid #303748;border-radius:24px;padding:23px;box-shadow:0 25px 90px #000}.close{float:right;width:34px;height:34px;border-radius:50%;border:0;background:#242b38;color:#fff}.modal input,.modal textarea{width:100%;padding:13px;background:#080a10;border:1px solid #303647;color:#fff;border-radius:12px;margin:7px 0}.modal textarea{min-height:100px;resize:vertical}.full{width:100%;margin-top:10px}.comment{padding:11px 0;border-bottom:1px solid #242a37}.toast{position:fixed;right:18px;bottom:18px;background:#161b27;border:1px solid #343c4f;color:#fff;padding:12px 15px;border-radius:13px;z-index:90}
.live-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.6fr);gap:16px;margin-top:24px}.live-player{position:relative;aspect-ratio:16/9;background:#080b12;border:1px solid #2b3344;border-radius:22px;overflow:hidden}.live-player video{width:100%;height:100%;object-fit:cover;background:#000}.live-placeholder{width:100%;height:100%;display:grid;place-items:center;color:#6f7990;font-size:28px;font-weight:900;background:radial-gradient(circle at 50% 35%,#3a286688,transparent 28%),#090d14}.live-chat{height:100%;min-height:420px;display:flex;flex-direction:column}.live-chat-list{flex:1;overflow:auto;max-height:58vh}.live-card{position:relative;min-height:180px;border:1px solid #2a3040;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#151128,#0b1a25);padding:18px;display:flex;flex-direction:column;justify-content:flex-end}.live-badge{display:inline-flex;align-items:center;gap:6px;background:#ff315f;color:#fff;font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;text-transform:uppercase}.live-card h3{margin:8px 0 4px;font-size:20px}.live-card p{margin:0;color:#a0a7ba}.live-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.live-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#0d111a;border:1px solid #2a3040;border-radius:16px;margin-top:12px}.live-stat{padding:8px 11px;border-radius:10px;background:#151a26;color:#d7dbe5;font-size:12px}

@media(max-width:900px){.live-layout{grid-template-columns:1fr}.live-grid{grid-template-columns:1fr 1fr}aside{display:none}main{margin:0}.mobile{display:block;position:absolute;left:15px}.search{width:44px;overflow:hidden}.search input{display:none}.page{padding:27px 17px}.cards{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.video-grid{grid-template-columns:1fr 1fr}.feed{padding:0}.video{width:100%;height:calc(100vh - 72px);min-height:0;border:0;border-radius:0}}
@media(max-width:520px){.cards{grid-template-columns:1fr}.page h1{font-size:32px}}
</style></head>
<body>
<aside><div class="logo">CLIP<span>TOK</span><small>FUTURE VIDEO NETWORK</small></div><nav id="nav"></nav><button class="create" id="createBtn">＋ Создать видео</button><div class="side-note">◈ AI recommendations<br>◉ Supabase backend<br>⚡ Realtime chat</div></aside>
<main><header><b class="mobile">CLIPTOK</b><div class="search">⌕ <input id="search" placeholder="Поиск видео, авторов и #хэштегов"></div><button class="avatar" id="avatarBtn">?</button></header><div id="root"></div></main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://lhquumfnuyjwzwcaskoi.supabase.co','sb_publishable_gs7j4qJk0xnsS9VYGMMgHg_IH8TXoHo');
const demo=[
{id:'demo1',profiles:{username:'neonwave',display_name:'Neon Wave'},caption:'Город после полуночи ✦',likes_count:128400,comments_count:1900,views_count:1800000,music_name:'Original sound'},
{id:'demo2',profiles:{username:'creatorlab',display_name:'Creator Lab'},caption:'Build something people remember.',likes_count:84200,comments_count:1200,views_count:930000,music_name:'Creator mode'},
{id:'demo3',profiles:{username:'motiondaily',display_name:'Motion Daily'},caption:'Motion is the new language.',likes_count:231000,comments_count:3200,views_count:3200000,music_name:'Future pulse'},
{id:'demo4',profiles:{username:'autofuture',display_name:'Auto Future'},caption:'Machines from another timeline.',likes_count:67200,comments_count:800,views_count:710000,music_name:'Road to 2030'}];
const nav=[['home','✦','Для вас'],['following','◎','Подписки'],['explore','⌕','Обзор'],['live','●','LIVE'],['messages','◌','Сообщения'],['notifications','◍','Уведомления'],['saved','▣','Сохранённые'],['profile','◉','Профиль'],['studio','◇','Creator Studio'],['settings','⚙','Настройки']];
document.querySelector('#nav').innerHTML=nav.map(n=>'<button data-tab="'+n[0]+'" onclick="window.show(\''+n[0]+'\')"><i>'+n[1]+'</i>'+n[2]+'</button>').join('');

let session=null,currentProfile=null,currentTab='home',feedData=[],liked=new Set(),saved=new Set(),following=new Set();
const fmt=n=>n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(m){const x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}
function authRequired(){document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="authModal"><div class="modal"><button class="close" onclick="authModal.remove()">×</button><h2>Войти в ClipTok</h2><p class="muted">Вход открывает лайки, комментарии, подписки, сохранение и загрузку видео.</p><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Пароль"><button class="primary full" onclick="window.signIn()">Войти</button><button class="ghost full" onclick="window.signUp()">Создать аккаунт</button></div></div>')}
window.signIn=async()=>{const {error}=await supabase.auth.signInWithPassword({email:authEmail.value.trim(),password:authPassword.value});if(error)toast(error.message);else{authModal.remove();await initSession();await window.show(currentTab)}};
window.signUp=async()=>{const e=authEmail.value.trim(),p=authPassword.value;if(!e)return toast('Введите email');if(p.length<6)return toast('Пароль: минимум 6 символов');const btn=document.querySelector('#authModal .primary');if(btn)btn.disabled=true;const {data,error}=await supabase.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});if(btn)btn.disabled=false;if(error){console.error(error);toast(error.message);return}if(data.session){authModal.remove();await initSession();toast('Аккаунт создан')}else{toast('Регистрация создана. Проверьте почту и перейдите по ссылке подтверждения.')}};
async function handleAuthRedirect(){const hash=window.location.hash||'';if(hash.includes('error=')){const p=new URLSearchParams(hash.slice(1));toast(decodeURIComponent(p.get('error_description')||'Ошибка подтверждения'));return}if(hash.includes('access_token=')){const x=await supabase.auth.getSession();if(x.data.session){session=x.data.session;await loadProfile();updateAvatar();toast('Email подтверждён — вы вошли в ClipTok');window.history.replaceState({},document.title,location.pathname+location.search)}}}
async function initSession(){const x=await supabase.auth.getSession();session=x.data.session;if(session)await loadProfile();updateAvatar();await handleAuthRedirect()}
async function loadProfile(){const r=await supabase.from('profiles').select('*').eq('id',session.user.id).maybeSingle();currentProfile=r.data||null}
function updateAvatar(){document.querySelector('#avatarBtn').textContent=currentProfile?.display_name?.slice(0,2).toUpperCase()||'?'}
async function loadSets(ids=[]){if(!session)return;const [l,s,f]=await Promise.all([supabase.from('likes').select('video_id').eq('user_id',session.user.id),supabase.from('saved_videos').select('video_id').eq('user_id',session.user.id),supabase.from('follows').select('following_id').eq('follower_id',session.user.id)]);liked=new Set((l.data||[]).map(x=>x.video_id));saved=new Set((s.data||[]).map(x=>x.video_id));following=new Set((f.data||[]).map(x=>x.following_id))}
async function loadFeed(tab){let q=supabase.from('videos').select('*,profiles(id,username,display_name,avatar_url,verified)').eq('status','published').order('created_at',{ascending:false}).limit(30);if(tab==='following'){if(!session)return [];const f=await supabase.from('follows').select('following_id').eq('follower_id',session.user.id);const ids=(f.data||[]).map(x=>x.following_id);if(!ids.length)return [];q=q.in('user_id',ids)}const r=await q;return r.data||[]}
function videoHTML(v){const p=v.profiles||{};return '<article class="video">'+(v.video_url?'<video src="'+esc(v.video_url)+'" playsinline loop autoplay muted controlslist="nodownload"></video>':'<div class="visual"></div><div class="brandmark">CLIP<span>TOK</span></div>')+'<div class="gradient"></div><div class="info"><b>@'+esc(p.username||'creator')+(p.verified?' ✓':'')+'</b><h2>'+esc(v.caption||'Без описания')+'</h2><p>♬ '+esc(v.music_name||'Original sound')+'</p></div><div class="actions"><button class="'+(liked.has(v.id)?'hot':'')+'" onclick="window.toggleLike(\''+v.id+'\')">♥<em>'+fmt(v.likes_count)+'</em></button><button onclick="window.openComments(\''+v.id+'\')">●<em>'+fmt(v.comments_count)+'</em></button><button class="'+(saved.has(v.id)?'hot':'')+'" onclick="window.toggleSave(\''+v.id+'\')">▣<em>Сохранить</em></button><button onclick="window.shareVideo(\''+v.id+'\')">↗<em>Share</em></button></div></article>'}
async function showTab(tab){
 currentTab=tab;
 document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('active',x.dataset.tab===tab)});
 const root=document.querySelector('#root');
 if(tab==='home'||tab==='following'){
   feedData=await loadFeed(tab);
   if(!feedData.length&&tab==='home') feedData=demo;
   await loadSets();
   root.innerHTML='<div class="feed">'+(feedData.length?feedData.map(videoHTML).join(''):'<div class="empty">Подписок пока нет.</div>')+'</div>';
   return;
 }
 if(tab==='explore'){await renderExplore();return;}
 if(tab==='live'){await renderLive();return;}
 if(tab==='notifications'){await renderNotifications();return;}
 if(tab==='saved'){await renderSaved();return;}
 if(tab==='profile'){await renderProfile(currentProfile?.id);return;}
 if(tab==='studio'){await renderStudio();return;}
 if(tab==='messages'){await renderMessages();return;}
 if(tab==='settings'){await renderSettings();return;}
}
window.show=showTab;
async function renderExplore(){const r=await supabase.from('videos').select('*,profiles(username,display_name)').eq('status','published').order('views_count',{ascending:false}).limit(24);const list=r.data?.length?r.data:demo;document.querySelector('#root').innerHTML='<section class="page"><h1>Explore</h1><p class="muted">Тренды и новые публикации.</p><div class="video-grid">'+list.map(v=>'<div class="video-tile">'+(v.video_url?'<video src="'+esc(v.video_url)+'" muted controls></video>':'<div class="visual"></div><div class="brandmark" style="top:45%">CLIP<span>TOK</span></div>')+'<div class="veil"><b>'+esc(v.caption)+'</b><div class="muted">@'+esc(v.profiles?.username||'creator')+' · '+fmt(v.views_count)+' просмотров</div></div></div>').join('')+'</div></section>'}

let liveChannel=null,liveRoom=null,localStream=null,liveRole=null,peerConnections=new Map(),pendingIce=new Map(),liveUserId=null;

async function renderLive(){
 const r=await supabase.from('live_rooms').select('*,profiles(username,display_name,avatar_url,verified)').eq('status','live').order('created_at',{ascending:false}).limit(30);
 const rooms=r.data||[];
 document.querySelector('#root').innerHTML='<section class="page"><div class="row"><div><h1>LIVE</h1><p class="muted">Прямые эфиры ClipTok в реальном времени.</p></div><div class="grow"></div><button class="primary" onclick="window.startLive()">＋ Начать эфир</button></div><div class="live-grid">'+(rooms.length?rooms.map(x=>'<div class="live-card"><span class="live-badge">● LIVE</span><h3>'+esc(x.title)+'</h3><p>@'+esc(x.profiles?.username||'creator')+' · '+esc(x.category||'general')+'</p><button class="ghost" style="margin-top:12px" onclick="window.joinLive(\\''+x.id+'\\')">Смотреть эфир</button></div>').join(''):'<div class="empty">Сейчас нет активных эфиров. Создай первый.</div>')+'</div></section>';
}

window.startLive=async()=>{
 if(!session)return authRequired();
 document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="liveCreateModal"><div class="modal"><button class="close" onclick="liveCreateModal.remove()">×</button><h2>Начать прямой эфир</h2><input id="liveTitle" placeholder="Название эфира"><textarea id="liveDesc" placeholder="О чём эфир?"></textarea><input id="liveCategory" placeholder="Категория, например gaming / music / talk"><button class="primary full" onclick="window.createLiveRoom()">Начать эфир</button></div></div>');
};

window.createLiveRoom=async()=>{
 const title=liveTitle.value.trim();if(!title)return toast('Введите название эфира');
 const r=await supabase.from('live_rooms').insert({host_id:session.user.id,title,description:liveDesc.value.trim(),category:liveCategory.value.trim()||'general',status:'live'}).select().single();
 if(r.error)return toast(r.error.message);
 liveCreateModal.remove(); await openLiveRoom(r.data.id,true);
};

async function openLiveRoom(roomId,isHost=false){
 const r=await supabase.from('live_rooms').select('*,profiles(username,display_name,avatar_url,verified)').eq('id',roomId).single();
 if(r.error)return toast(r.error.message);
 if(r.data.status!=='live' && !isHost)return toast('Эфир уже завершён');
 liveRoom=r.data; liveRole=isHost?'host':'viewer'; liveUserId=session?.user?.id||('guest-'+crypto.randomUUID());
 const chat=await supabase.from('live_chat_messages').select('*,profiles(username,display_name)').eq('room_id',roomId).order('created_at',{ascending:true}).limit(100);
 document.querySelector('#root').innerHTML='<section class="page"><div class="row"><div><div class="live-badge">● LIVE</div><h1>'+esc(liveRoom.title)+'</h1><p class="muted">@'+esc(liveRoom.profiles?.username||'creator')+' · '+esc(liveRoom.category||'general')+'</p></div><div class="grow"></div><button class="ghost" onclick="window.show(\\'live\\')">← LIVE</button></div><div class="live-layout"><div><div class="live-player" id="liveStage">'+(isHost?'<video id="localLiveVideo" autoplay playsinline muted></video>':'<div class="live-placeholder" id="livePlaceholder">ПОДКЛЮЧЕНИЕ…</div><video id="remoteLiveVideo" autoplay playsinline controls style="display:none"></video>')+'</div><div class="live-controls"><span class="live-stat" id="viewerCount">● 1 зритель</span><span class="live-stat">Realtime</span>'+ (isHost?'<button class="danger" onclick="window.endLive()">Завершить эфир</button>':'')+'</div></div><div class="card live-chat"><h3>Чат эфира</h3><div id="liveChatList" class="live-chat-list">'+((chat.data||[]).map(m=>'<div class="comment"><b>@'+esc(m.profiles?.username||'user')+'</b><div>'+esc(m.body)+'</div></div>').join('')||'<div class="empty">Чат пуст.</div>')+'</div><div class="row"><input id="liveChatInput" class="grow" placeholder="'+(session?'Написать сообщение…':'Войдите для чата')+'" '+(session?'':'disabled')+'><button class="primary" onclick="window.sendLiveChat()">Отправить</button></div></div></div></section>';
 await connectLive(roomId,isHost);
}

async function connectLive(roomId,isHost){
 if(liveChannel)try{await supabase.removeChannel(liveChannel)}catch{}
 liveChannel=supabase.channel('live:'+roomId);
 liveChannel.on('presence',{event:'sync'},()=>{const state=liveChannel.presenceState();const count=Object.values(state).reduce((n,a)=>n+a.length,0);const el=document.querySelector('#viewerCount');if(el)el.textContent='● '+count+' зрителей'}).on('presence',{event:'join'},()=>{}).on('presence',{event:'leave'},()=>{});
 liveChannel.on('broadcast',{event:'signal'},async(payload)=>{const d=payload.payload||{};if(d.target&&d.target!==liveUserId)return;
   if(d.kind==='viewer-join'&&isHost){await handleViewerJoin(d.from)}
   if(d.kind==='offer'&&!isHost){await handleOffer(d)}
   if(d.kind==='answer'&&isHost){await handleAnswer(d)}
   if(d.kind==='ice'){await handleIce(d)}
   if(d.kind==='chat'){appendLiveChat(d)}
 });
 await liveChannel.subscribe(async status=>{if(status!=='SUBSCRIBED')return;
   await liveChannel.track({user_id:liveUserId,role:isHost?'host':'viewer'});
   if(!isHost)await liveChannel.send({type:'broadcast',event:'signal',payload:{kind:'viewer-join',from:liveUserId,target:liveRoom.host_id}});
 });
 if(isHost){
   try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});const v=document.querySelector('#localLiveVideo');if(v)v.srcObject=localStream}catch(e){toast('Нет доступа к камере/микрофону');console.error(e)}
 }
}
async function makePeer(id,initiator){
 const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
 peerConnections.set(id,pc);pendingIce.set(id,[]);
 if(liveRole==='host'&&localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.onicecandidate=e=>{if(e.candidate)liveChannel.send({type:'broadcast',event:'signal',payload:{kind:'ice',from:liveUserId,target:id,candidate:e.candidate}})};
 if(liveRole==='viewer')pc.ontrack=e=>{const v=document.querySelector('#remoteLiveVideo');const p=document.querySelector('#livePlaceholder');if(v){v.srcObject=e.streams[0];v.style.display='block'}if(p)p.style.display='none'};
 if(initiator){const offer=await pc.createOffer();await pc.setLocalDescription(offer);await liveChannel.send({type:'broadcast',event:'signal',payload:{kind:'offer',from:liveUserId,target:id,sdp:offer}})}
 return pc;
}
async function handleViewerJoin(viewerId){if(peerConnections.has(viewerId))return;await makePeer(viewerId,true)}
async function handleOffer(d){const pc=peerConnections.get(d.from)||await makePeer(d.from,false);await pc.setRemoteDescription(d.sdp);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await liveChannel.send({type:'broadcast',event:'signal',payload:{kind:'answer',from:liveUserId,target:d.from,sdp:answer}});for(const c of (pendingIce.get(d.from)||[])){try{await pc.addIceCandidate(c)}catch{}}pendingIce.set(d.from,[])}
async function handleAnswer(d){const pc=peerConnections.get(d.from);if(!pc)return;await pc.setRemoteDescription(d.sdp);for(const c of (pendingIce.get(d.from)||[])){try{await pc.addIceCandidate(c)}catch{}}pendingIce.set(d.from,[])}
async function handleIce(d){const pc=peerConnections.get(d.from);if(!pc||(pc.remoteDescription&&pc.remoteDescription.type)){try{if(pc)await pc.addIceCandidate(d.candidate)}catch{}}else{(pendingIce.get(d.from)||[]).push(d.candidate)}}
function appendLiveChat(d){const list=document.querySelector('#liveChatList');if(!list)return;list.insertAdjacentHTML('beforeend','<div class="comment"><b>@'+esc(d.username||'user')+'</b><div>'+esc(d.body)+'</div></div>');list.scrollTop=list.scrollHeight}
window.sendLiveChat=async()=>{
 if(!session)return authRequired();const body=document.querySelector('#liveChatInput')?.value.trim();if(!body)return;
 const r=await supabase.from('live_chat_messages').insert({room_id:liveRoom.id,user_id:session.user.id,body});
 if(r.error)return toast(r.error.message);document.querySelector('#liveChatInput').value='';const username=currentProfile?.username||'user';await liveChannel.send({type:'broadcast',event:'signal',payload:{kind:'chat',from:liveUserId,username,body}});
};
window.endLive=async()=>{
 if(!session||!liveRoom||liveRoom.host_id!==session.user.id)return;
 const r=await supabase.from('live_rooms').update({status:'ended',ended_at:new Date().toISOString()}).eq('id',liveRoom.id).eq('host_id',session.user.id);
 if(r.error)return toast(r.error.message);if(localStream)localStream.getTracks().forEach(t=>t.stop());for(const p of peerConnections.values())p.close();peerConnections.clear();if(liveChannel)try{await supabase.removeChannel(liveChannel)}catch{};liveChannel=null;liveRoom=null;toast('Эфир завершён');await window.show('live');
};
window.joinLive=async id=>{if(!session){authRequired();return}await openLiveRoom(id,false)};

async function renderNotifications(){if(!session)return authRequired();const r=await supabase.from('notifications').select('*,actor:profiles!notifications_actor_id_fkey(username,display_name)').order('created_at',{ascending:false}).limit(50);document.querySelector('#root').innerHTML='<section class="page"><h1>Уведомления</h1><div class="card">'+((r.data||[]).map(n=>'<div class="comment"><b>@'+esc(n.actor?.username||'system')+'</b> — '+esc(n.body)+'<div class="muted">'+new Date(n.created_at).toLocaleString('ru-RU')+'</div></div>').join('')||'<div class="empty">Пока пусто.</div>')+'</div></section>';await supabase.from('notifications').update({read:true}).eq('user_id',session.user.id).eq('read',false)}
async function renderSaved(){if(!session)return authRequired();const r=await supabase.from('saved_videos').select('video_id').eq('user_id',session.user.id);const ids=(r.data||[]).map(x=>x.video_id);if(!ids.length){document.querySelector('#root').innerHTML='<section class="page"><h1>Сохранённые</h1><div class="empty">Здесь будут сохранённые видео.</div></section>';return}const v=await supabase.from('videos').select('*,profiles(username,display_name)').in('id',ids);document.querySelector('#root').innerHTML='<section class="page"><h1>Сохранённые</h1><div class="video-grid">'+(v.data||[]).map(x=>'<div class="video-tile"><video src="'+esc(x.video_url)+'" controls></video><div class="veil"><b>'+esc(x.caption)+'</b></div></div>').join('')+'</div></section>'}
async function renderProfile(id){if(!id&&!session)return authRequired();id=id||session.user.id;const [p,vs]=await Promise.all([supabase.from('profiles').select('*').eq('id',id).single(),supabase.from('videos').select('*').eq('user_id',id).eq('status','published').order('created_at',{ascending:false})]);const me=session?.user?.id===id;const f=following.has(id);document.querySelector('#root').innerHTML='<section class="page"><div class="row"><div style="width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,#5735a3,#1cc3d0);display:grid;place-items:center;font-size:24px;font-weight:900">'+esc((p.data?.display_name||'?').slice(0,2).toUpperCase())+'</div><div><h1 style="margin:0">'+esc(p.data?.display_name||'Профиль')+'</h1><div class="muted">@'+esc(p.data?.username||'user')+'</div><div class="muted">'+esc(p.data?.bio||'')+'</div></div><div class="grow"></div>'+(!me&&session?'<button class="primary" onclick="window.toggleFollow(\''+id+'\')">'+(f?'Отписаться':'Подписаться')+'</button>':'')+'</div><div class="metrics"><div class="metric"><b>'+fmt(p.data?.followers_count)+'</b><span>Подписчики</span></div><div class="metric"><b>'+fmt(p.data?.following_count)+'</b><span>Подписки</span></div><div class="metric"><b>'+fmt(p.data?.videos_count)+'</b><span>Видео</span></div><div class="metric"><b>'+fmt((vs.data||[]).reduce((a,x)=>a+(x.views_count||0),0))+'</b><span>Просмотры</span></div></div><div class="video-grid">'+((vs.data||[]).map(v=>'<div class="video-tile"><video src="'+esc(v.video_url)+'" controls></video><div class="veil"><b>'+esc(v.caption)+'</b><div class="muted">'+fmt(v.likes_count)+' ♥</div></div></div>').join('')||'<div class="empty">Видео пока нет.</div>')+'</div></section>'}
window.toggleFollow=async id=>{if(!session)return authRequired();const ex=following.has(id);const r=ex?await supabase.from('follows').delete().match({follower_id:session.user.id,following_id:id}):await supabase.from('follows').insert({follower_id:session.user.id,following_id:id});if(r.error)toast(r.error.message);else{ex?following.delete(id):following.add(id);toast(ex?'Подписка отменена':'Подписка оформлена');await renderProfile(id)}};
window.toggleLike=async id=>{if(!session)return authRequired();const ex=liked.has(id);const r=ex?await supabase.from('likes').delete().match({user_id:session.user.id,video_id:id}):await supabase.from('likes').insert({user_id:session.user.id,video_id:id});if(r.error)toast(r.error.message);else{ex?liked.delete(id):liked.add(id);await window.show(currentTab)}};
window.toggleSave=async id=>{if(!session)return authRequired();const ex=saved.has(id);const r=ex?await supabase.from('saved_videos').delete().match({user_id:session.user.id,video_id:id}):await supabase.from('saved_videos').insert({user_id:session.user.id,video_id:id});if(r.error)toast(r.error.message);else{ex?saved.delete(id):saved.add(id);toast(ex?'Удалено из сохранённых':'Сохранено')}};
window.openComments=async id=>{const v=feedData.find(x=>x.id===id)||demo.find(x=>x.id===id)||{};const r=String(id).startsWith('demo')?{data:[]} : await supabase.from('comments').select('*,profiles(username,display_name)').eq('video_id',id).order('created_at',{ascending:false});document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="commentsModal"><div class="modal"><button class="close" onclick="commentsModal.remove()">×</button><h2>Комментарии</h2><p class="muted">'+esc(v.caption||'')+'</p><div>'+((r.data||[]).map(c=>'<div class="comment"><b>@'+esc(c.profiles?.username||'user')+'</b><div>'+esc(c.body)+'</div></div>').join('')||'<div class="empty">Пока нет комментариев.</div>')+'</div>'+(session&&!String(id).startsWith('demo')?'<textarea id="commentText" placeholder="Ваш комментарий"></textarea><button class="primary full" onclick="window.addComment(\''+id+'\')">Отправить</button>':'<button class="ghost full" onclick="commentsModal.remove()">Войдите, чтобы комментировать</button>')+'</div></div>')};
window.addComment=async id=>{const body=commentText.value.trim();if(!body)return;const r=await supabase.from('comments').insert({video_id:id,user_id:session.user.id,body});if(r.error)toast(r.error.message);else{commentsModal.remove();toast('Комментарий опубликован');await window.openComments(id)}};
window.shareVideo=async id=>{const u=location.href.split('#')[0]+'#video='+id;try{await navigator.clipboard.writeText(u);toast('Ссылка скопирована')}catch{toast(u)}};
async function renderStudio(){if(!session)return authRequired();const r=await supabase.from('videos').select('*').eq('user_id',session.user.id);const a=r.data||[];document.querySelector('#root').innerHTML='<section class="page"><h1>Creator Studio</h1><p class="muted">Аналитика реального аккаунта.</p><div class="metrics"><div class="metric"><b>'+fmt(a.reduce((s,v)=>s+(v.views_count||0),0))+'</b><span>Просмотры</span></div><div class="metric"><b>'+fmt(a.reduce((s,v)=>s+(v.likes_count||0),0))+'</b><span>Лайки</span></div><div class="metric"><b>'+fmt(a.reduce((s,v)=>s+(v.comments_count||0),0))+'</b><span>Комментарии</span></div><div class="metric"><b>'+a.length+'</b><span>Видео</span></div></div><div class="card"><h2>Контент</h2>'+(a.map(v=>'<div class="comment"><b>'+esc(v.caption||'Без названия')+'</b> <span class="pill">'+esc(v.status)+'</span><span class="muted"> · '+fmt(v.views_count)+' views</span></div>').join('')||'<div class="empty">Видео нет.</div>')+'</div></section>'}
async function renderSettings(){if(!session)return authRequired();const p=currentProfile||{};document.querySelector('#root').innerHTML='<section class="page"><h1>Настройки</h1><div class="card"><input id="setDisplay" value="'+esc(p.display_name||'')+'" placeholder="Имя"><input id="setUsername" value="'+esc(p.username||'')+'" placeholder="Username"><textarea id="setBio" placeholder="О себе">'+esc(p.bio||'')+'</textarea><button class="primary" onclick="window.saveSettings()">Сохранить</button></div><div class="card" style="margin-top:16px"><p class="muted">'+esc(session.user.email)+'</p><button class="danger" onclick="window.logout()">Выйти</button></div></section>'}
window.saveSettings=async()=>{const r=await supabase.from('profiles').update({display_name:setDisplay.value.trim()||'User',username:setUsername.value.trim(),bio:setBio.value}).eq('id',session.user.id).select().single();if(r.error)toast(r.error.message);else{currentProfile=r.data;updateAvatar();toast('Профиль сохранён')}};
window.logout=async()=>{await supabase.auth.signOut();session=null;currentProfile=null;updateAvatar();await window.show('home')};
async function renderMessages(){if(!session)return authRequired();const m=await supabase.from('conversation_members').select('conversation_id,user_id,profiles(username,display_name)').eq('user_id',session.user.id);const ids=[...new Set((m.data||[]).map(x=>x.conversation_id))];document.querySelector('#root').innerHTML='<section class="page"><h1>Сообщения</h1><p class="muted">Realtime чаты подключены к Supabase.</p>'+(ids.length?'<div class="cards">'+ids.map(cid=>'<div class="card"><b>Диалог</b><button class="primary" style="margin-top:12px" onclick="window.openChat(\''+cid+'\')">Открыть</button></div>').join('')+'</div>':'<div class="empty">Диалогов пока нет.</div>')+'</section>'}
window.openChat=async cid=>{const r=await supabase.from('messages').select('*,profiles(username,display_name)').eq('conversation_id',cid).order('created_at',{ascending:true});document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="chatModal"><div class="modal"><button class="close" onclick="chatModal.remove()">×</button><h2>Чат</h2><div id="chatList" style="max-height:45vh;overflow:auto">'+((r.data||[]).map(m=>'<div class="comment"><b>@'+esc(m.profiles?.username||'user')+'</b><div>'+esc(m.body)+'</div></div>').join('')||'<div class="empty">Начните разговор.</div>')+'</div><div class="row"><input id="chatText" class="grow" placeholder="Сообщение..."><button class="primary" onclick="window.sendMessage(\''+cid+'\')">Отправить</button></div></div></div>');supabase.channel('chat-'+cid).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},p=>{const m=p.new;if(m.sender_id!==session.user.id)document.querySelector('#chatList')?.insertAdjacentHTML('beforeend','<div class="comment"><b>Новое сообщение</b><div>'+esc(m.body)+'</div></div>')}).subscribe()};
window.sendMessage=async cid=>{const body=chatText.value.trim();if(!body)return;const r=await supabase.from('messages').insert({conversation_id:cid,sender_id:session.user.id,body});if(r.error)toast(r.error.message);else{chatText.value='';await window.openChat(cid)}};
document.querySelector('#createBtn').onclick=()=>{if(!session)return authRequired();document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="uploadModal"><div class="modal"><button class="close" onclick="uploadModal.remove()">×</button><h2>Создать</h2><button class="primary full" onclick="uploadModal.remove();window.startLive()">🔴 Начать прямой эфир</button><p class="muted" style="text-align:center;margin:10px 0">или</p><h3>Новое видео</h3><p class="muted">Видео загружается в Supabase Storage.</p><input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime"><textarea id="videoCaption" placeholder="Описание видео"></textarea><input id="musicName" placeholder="Название трека"><button class="primary full" onclick="window.uploadVideo()">Опубликовать</button></div></div>')};
window.uploadVideo=async()=>{const file=videoFile.files[0];if(!file)return toast('Выберите видео');if(file.size>500*1024*1024)return toast('Максимум 500 MB');const name=file.name.replace(/[^\w.\-а-яА-Я]/g,'_');const path=session.user.id+'/'+Date.now()+'-'+name;const u=await supabase.storage.from('videos').upload(path,file,{contentType:file.type||'video/mp4'});if(u.error)return toast(u.error.message);const url=supabase.storage.from('videos').getPublicUrl(path).data.publicUrl;const r=await supabase.from('videos').insert({user_id:session.user.id,video_url:url,caption:videoCaption.value.trim(),music_name:musicName.value.trim(),status:'published'});if(r.error)return toast(r.error.message);uploadModal.remove();toast('Видео опубликовано');await window.show('home')};
document.querySelector('#avatarBtn').onclick=()=>session?window.show('profile'):authRequired();
document.querySelector('#search').addEventListener('keydown',async e=>{if(e.key!=='Enter')return;const q=e.target.value.trim();if(!q)return;const [v,p]=await Promise.all([supabase.from('videos').select('*,profiles(username,display_name)').ilike('caption','%'+q+'%').limit(24),supabase.from('profiles').select('*').or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').limit(12)]);document.querySelector('#root').innerHTML='<section class="page"><h1>Поиск</h1><p class="muted">'+esc(q)+'</p><h2>Авторы</h2><div class="cards">'+((p.data||[]).map(x=>'<div class="card"><b>'+esc(x.display_name)+'</b><p class="muted">@'+esc(x.username)+'</p><button class="primary" onclick="window.renderProfile(\''+x.id+'\')">Профиль</button></div>').join('')||'<div class="empty">Авторов нет.</div>')+'</div><h2 style="margin-top:28px">Видео</h2><div class="video-grid">'+((v.data||[]).map(x=>'<div class="video-tile"><video src="'+esc(x.video_url)+'" controls></video><div class="veil"><b>'+esc(x.caption)+'</b></div></div>').join('')||'<div class="empty">Видео нет.</div>')+'</div></section>'});
window.renderProfile=renderProfile;
await initSession();await window.show('home');
supabase.auth.onAuthStateChange(async(_e,s)=>{session=s;if(s){await loadProfile();updateAvatar()}else{session=null;currentProfile=null;updateAvatar()}});
</script></body></html>
